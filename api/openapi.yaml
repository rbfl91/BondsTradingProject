openapi: 3.0.3
info:
  title: Bonds Trading API
  version: 1.0.0
  description: |
    API for interacting with the Bond Trading smart contract.
security:
  - BearerAuth: []
servers:
  - url: http://localhost:5000
    description: Local development server
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
  /contract/address:
    get:
      summary: Get the contract address
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: Contract address returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_address:
                    type: string
                    example: "0x0000000000000000000000000000000000000000"
  /auth/check:
    get:
      summary: Validate bearer token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorized:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Missing or invalid token
  /bond/issue:
    post:
      summary: Issue a new bond
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBondRequest'
      responses:
        '401':
          description: Missing or invalid token
        '201':
          description: Bond issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBondResponse'
        '400':
          description: Missing required parameters
        '500':
          description: Server error
  /bond/purchase:
    post:
      summary: Purchase a bond
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseBondRequest'
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: Bond purchased successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseBondResponse'
        '400':
          description: Missing required parameters
        '500':
          description: Server error
  /bond/sell:
    post:
      summary: Sell a bond
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellBondRequest'
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: Bond sold successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellBondResponse'
        '400':
          description: Missing required parameters
        '500':
          description: Server error
  /bond/redeem:
    post:
      summary: Redeem a bond
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemBondRequest'
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: Bond redeemed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemBondResponse'
        '400':
          description: Missing required parameters
        '500':
          description: Server error
  /bond/{bond_id}/info:
    get:
      summary: Get information about a specific bond
      parameters:
        - name: bond_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: Bond information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBondInfoResponse'
        '500':
          description: Server error
  /bond/{bond_id}/holders:
    get:
      summary: Get list of holders for a specific bond
      parameters:
        - name: bond_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: Bond holders retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBondHoldersResponse'
        '500':
          description: Server error
  /bond/{bond_id}/holder/{holder_address}/amount:
    get:
      summary: Get the amount of bonds a specific holder has
      parameters:
        - name: bond_id
          in: path
          required: true
          schema:
            type: integer
        - name: holder_address
          in: path
          required: true
          schema:
            type: string
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: Bond holder amount retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBondHolderAmountResponse'
        '500':
          description: Server error
  /status:
    get:
      summary: Get API status information
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: API status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiStatusResponse'
  /bond/count:
    get:
      summary: Get the total number of bonds issued
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: Bond count returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  bondCount:
                    type: integer
  /bond/all:
    get:
      summary: Get ALL bonds in one call (batch view, replaces N sequential calls)
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: All bonds returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllBondsResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitExceeded'
        '500':
          description: Server error
  /crypto/listings:
    get:
      summary: Top cryptocurrencies (USD-converted)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 5000 }
        - name: start
          in: query
          schema: { type: integer, default: 1 }
        - name: tag
          in: query
          schema: { type: string }
      responses:
        '401':
          description: Missing or invalid token
        '400':
          description: Invalid numeric query parameter
        '200':
          description: Crypto listings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoUpstreamResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitExceeded'
        '502':
          description: Upstream CoinMarketCap error
  /crypto/ohlc:
    get:
      summary: OHLC data for a single cryptocurrency
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: BTC }
        - name: days
          in: query
          schema: { type: integer, default: 7, minimum: 1, maximum: 365 }
        - name: start
          in: query
          schema: { type: integer }
        - name: end
          in: query
          schema: { type: string }
      responses:
        '401':
          description: Missing or invalid token
        '400':
          description: Invalid query parameter
        '200':
          description: OHLC data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoUpstreamResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitExceeded'
        '502':
          description: Upstream CoinMarketCap error
  /crypto/supply:
    get:
      summary: Supply data for a single cryptocurrency
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: BTC }
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: Supply data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoUpstreamResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitExceeded'
        '502':
          description: Upstream CoinMarketCap error
  /crypto/movers-gainers:
    get:
      summary: Top movers and gainers (24h)
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: Movers/gainers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoUpstreamResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitExceeded'
        '502':
          description: Upstream CoinMarketCap error
  /crypto/global-metrics:
    get:
      summary: Global market metrics
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: Global metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoUpstreamResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitExceeded'
        '502':
          description: Upstream CoinMarketCap error
  /crypto/convert:
    get:
      summary: Convert a crypto amount to another currency
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: BTC }
        - name: amount
          in: query
          schema: { type: number, default: 1 }
        - name: convert
          in: query
          schema: { type: string, default: USD }
      responses:
        '401':
          description: Missing or invalid token
        '400':
          description: Invalid numeric query parameter
        '200':
          description: Conversion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoUpstreamResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitExceeded'
        '502':
          description: Upstream CoinMarketCap error
  /crypto/news:
    get:
      summary: Cryptocurrency news (CoinDesk RSS, cached 15 min; empty + source=unavailable on failure)
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: News items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoNewsResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitExceeded'
  /crypto/trending:
    get:
      summary: Trending cryptocurrencies
      responses:
        '401':
          description: Missing or invalid token
        '200':
          description: Trending coins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoUpstreamResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitExceeded'
        '502':
          description: Upstream CoinMarketCap error
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    IssueBondRequest:
      type: object
      required:
        - name
        - issuer
        - faceValue
        - maturityDate
        - interestRate
        - supply
      properties:
        name:
          type: string
        issuer:
          type: string
        faceValue:
          type: integer
        maturityDate:
          type: integer
        interestRate:
          type: integer
          description: Interest rate in BASIS POINTS (500 = 5.00%). 0-10000.
          minimum: 0
          maximum: 10000
        supply:
          type: integer
      example:
        name: "Corporate Bond"
        issuer: "Acme Corp"
        faceValue: 1000
        maturityDate: 1735689600
        interestRate: 500
        supply: 10000
    IssueBondResponse:
      type: object
      properties:
        message:
          type: string
          example: Bond issued successfully
        name:
          type: string
        issuer:
          type: string
        faceValue:
          type: integer
        maturityDate:
          type: integer
        interestRate:
          type: integer
        supply:
          type: integer
      example:
        message: "Bond issued successfully"
        name: "Corporate Bond"
        issuer: "Acme Corp"
        faceValue: 1000
        maturityDate: 1735689600
        interestRate: 5
        supply: 10000
    PurchaseBondRequest:
      type: object
      required:
        - bondId
        - amount
      properties:
        bondId:
          type: integer
        amount:
          type: integer
      example:
        bondId: 1
        amount: 10
    PurchaseBondResponse:
      type: object
      properties:
        message:
          type: string
          example: Bond purchased successfully
        bondId:
          type: integer
        amount:
          type: integer
      example:
        message: "Bond purchased successfully"
        bondId: 1
        amount: 10
    SellBondRequest:
      type: object
      required:
        - bondId
        - amount
        - buyerAddress
      properties:
        bondId:
          type: integer
        amount:
          type: integer
        buyerAddress:
          type: string
      example:
        bondId: 1
        amount: 5
        buyerAddress: "0x1234567890abcdef1234567890abcdef12345678"
    SellBondResponse:
      type: object
      properties:
        message:
          type: string
          example: Bond sold successfully
        bondId:
          type: integer
        amount:
          type: integer
        buyerAddress:
          type: string
      example:
        message: "Bond sold successfully"
        bondId: 1
        amount: 5
        buyerAddress: "0x1234567890abcdef1234567890abcdef12345678"
    RedeemBondRequest:
      type: object
      required:
        - bondId
        - amount
      properties:
        bondId:
          type: integer
        amount:
          type: integer
      example:
        bondId: 1
        amount: 10
    RedeemBondResponse:
      type: object
      properties:
        message:
          type: string
          example: Bond redeemed successfully
        bondId:
          type: integer
        amount:
          type: integer
      example:
        message: "Bond redeemed successfully"
        bondId: 1
        amount: 10
    BondView:
      type: object
      properties:
        bondId:
          type: integer
        name:
          type: string
        issuer:
          type: string
        faceValue:
          type: integer
        maturityDate:
          type: integer
        interestRate:
          type: integer
          description: Basis points (500 = 5.00%)
        totalSupply:
          type: integer
          description: Original issuance size
        remainingSupply:
          type: integer
          description: Not yet purchased in the primary market
        isActive:
          type: boolean
      example:
        bondId: 1
        name: "Corporate Bond"
        issuer: "Acme Corp"
        faceValue: 1000
        maturityDate: 1735689600
        interestRate: 500
        totalSupply: 10000
        remainingSupply: 9000
        isActive: true
    GetBondInfoResponse:
      allOf:
        - $ref: '#/components/schemas/BondView'
    GetAllBondsResponse:
      type: object
      properties:
        bonds:
          type: array
          items:
            $ref: '#/components/schemas/BondView'
        bondCount:
          type: integer
    CryptoUpstreamResponse:
      type: object
      description: Passthrough of the CoinMarketCap response (or an error object when the upstream call fails)
      properties:
        status:
          type: string
        data: {}
        error:
          type: string
    CryptoNewsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
              url:
                type: string
              source:
                type: string
              time:
                type: string
        source:
          type: string
          description: 'CoinDesk when live; unavailable when the feed could not be fetched (data is then empty)'
        message:
          type: string
    RateLimitExceeded:
      type: object
      properties:
        error:
          type: string
          example: Rate limit exceeded. Please try again later.
    GetBondHoldersResponse:
      type: object
      properties:
        bondId:
          type: integer
        message:
          type: string
          example: Bond holders retrieved successfully
      example:
        bondId: 1
        message: "Bond holders retrieved successfully"
    GetBondHolderAmountResponse:
      type: object
      properties:
        bondId:
          type: integer
        holderAddress:
          type: string
        message:
          type: string
          example: Bond holder amount retrieved successfully
      example:
        bondId: 1
        holderAddress: "0x1234567890abcdef1234567890abcdef12345678"
        message: "Bond holder amount retrieved successfully"
    ApiStatusResponse:
      type: object
      properties:
        status:
          type: string
          example: API is running
        blockchain_connected:
          type: boolean
        endpoints:
          type: array
          items:
            type: string
      example:
        status: "API is running"
        model: "single-tenant owner dashboard (all txs signed by the operator key)"
        blockchain_connected: true
        endpoints:
          - "/health"
          - "/contract/address"
          - "/bond/issue"
          - "/bond/purchase"
          - "/bond/sell"
          - "/bond/redeem"
          - "/bond/count"
          - "/bond/all"
          - "/bond/{bond_id}/info"
          - "/bond/{bond_id}/holders"
          - "/bond/{bond_id}/holder/{holder_address}/amount"
          - "/crypto/listings"
          - "/crypto/ohlc"
          - "/crypto/supply"
          - "/crypto/movers-gainers"
          - "/crypto/global-metrics"
          - "/crypto/convert"
          - "/crypto/news"
          - "/crypto/trending"
          - "/status"
