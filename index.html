    ctx.beginPath(); ctx.arc(-6, -r*1.05, 2.6, 0, Math.PI*2); ctx.arc(6, -r*1.05, 2.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-6.8, -r*1.05, 1.2, 0, Math.PI*2); ctx.arc(5.2, -r*1.05, 1.2, 0, Math.PI*2); ctx.fill();
  } else if (e.type === 'roll'){
    /* ROLL: the Roller — a ball with a red band, rolling its lane */
    const a = e.spin || 0;
    ctx.fillStyle = '#b8c0d0';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
    /* red band, rotating with the roll */
    ctx.save();
    ctx.rotate(a);
    ctx.fillStyle = '#e04a4a';
    ctx.beginPath(); ctx.arc(0, 0, r, -0.4, 0.4); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, r, Math.PI-0.4, Math.PI+0.4); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    /* face dot rides the rotation */
    ctx.fillStyle = '#3a4050';
    ctx.beginPath(); ctx.arc(Math.cos(a)*r*0.55, Math.sin(a)*r*0.55, 2.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#6a7080'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(-r*0.4, -r*0.4, 3, 0, Math.PI*2); ctx.fill();
  } else if (e.type === 'hide'){
    /* HIDE (the Burrobot): a rubble mound that leaps when you approach */
    const out = (e.vy || 0) < 0 || e.y < e.base - 4;
    const moundY = (e.base - e.y) - r; /* the mound stays at the ground */
    ctx.fillStyle = '#8a7a50';
    ctx.beginPath();
    ctx.moveTo(-r-6, moundY + r);
    ctx.quadraticCurveTo(-r*0.6, moundY - r*0.5, 0, moundY - r*0.6);
    ctx.quadraticCurveTo(r*0.6, moundY - r*0.5, r+6, moundY + r);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6a5c3a';
    ctx.beginPath();
    ctx.moveTo(-r*0.45, moundY + r*0.4); ctx.lineTo(0, moundY - r*0.35); ctx.lineTo(r*0.45, moundY + r*0.4);
    ctx.closePath(); ctx.fill();
    if (out){
      /* the green robot head pokes out */
      ctx.fillStyle = '#4a9a5a';
      roundRect(-9, -r*0.9, 18, 16, 4); ctx.fill();
      ctx.fillStyle = '#2e6a3a';
      ctx.fillRect(-9, -r*0.9+10, 18, 4);
      ctx.fillStyle = '#ffd23e';
      ctx.beginPath(); ctx.arc(-4.5, -r*0.9+6, 2.6, 0, Math.PI*2); ctx.arc(4.5, -r*0.9+6, 2.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-5, -r*0.9+6, 1.1, 0, Math.PI*2); ctx.arc(4, -r*0.9+6, 1.1, 0, Math.PI*2); ctx.fill();
    } else {
      /* buried: just a pair of sly crack-eyes */
      ctx.strokeStyle = 'rgba(255,210,62,0.9)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-5, moundY - r*0.05); ctx.lineTo(-1, moundY - r*0.25);
      ctx.moveTo(5, moundY - r*0.05); ctx.lineTo(1, moundY - r*0.25);
      ctx.stroke();
    }
  } else if (e.type === 'jaws'){
    /* JAWS: spiky ball patrolling the water, jaws snapping */
    const snap = Math.sin(globalT*5 + e.t) * 0.5;
    ctx.fillStyle = '#3a6a7a';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
    /* rotating spikes */
    ctx.fillStyle = '#2a4a5a';
    for (let i = 0; i < 8; i++){
      const a = i/8*Math.PI*2 + globalT*0.8;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*0.7, Math.sin(a)*r*0.7);
      ctx.lineTo(Math.cos(a)*(r+7), Math.sin(a)*(r+7));
      ctx.lineTo(Math.cos(a+0.35)*r*0.7, Math.sin(a+0.35)*r*0.7);
      ctx.closePath(); ctx.fill();
    }
    /* open jaw */
    ctx.fillStyle = '#e8e0d0';
    ctx.beginPath();
    ctx.moveTo(r*0.4, -2);
    ctx.lineTo(r*1.3, -2 - snap*8);
    ctx.lineTo(r*1.0, 2);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r*0.4, 3);
    ctx.lineTo(r*1.25, 3 + snap*8);
    ctx.lineTo(r*0.95, 6);
    ctx.closePath(); ctx.fill();
    /* eye */
    ctx.fillStyle = '#ff5a4e';
    ctx.beginPath(); ctx.arc(-r*0.35, -r*0.3, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-r*0.35, -r*0.3, 1.2, 0, Math.PI*2); ctx.fill();
  } else if (e.type === 'unid'){
    /* UNID (Unidus): heavy green turtle, slow and steady */
    const lp = Math.sin(globalT*4) * 3;
    ctx.strokeStyle = '#4a6a3a'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-r*0.6, r*0.5); ctx.lineTo(-r*0.75, r*0.9 + lp);
    ctx.moveTo(r*0.4, r*0.5); ctx.lineTo(r*0.55, r*0.9 - lp);
    ctx.stroke();
    /* shell */
    ctx.fillStyle = '#5a8a4a';
    ctx.beginPath(); ctx.ellipse(0, 0, r, r*0.8, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3e6a32';
    for (let i = -1; i <= 1; i++){
      ctx.beginPath(); ctx.arc(i*r*0.5, 0, r*0.42, 0, Math.PI*2); ctx.fill();
    }
    /* shell spikes */
    ctx.fillStyle = '#c9d8a0';
    for (let i = 0; i < 5; i++){
      const sx = -r*0.7 + i*r*0.35;
      ctx.beginPath();
      ctx.moveTo(sx-3, -r*0.5);
      ctx.lineTo(sx, -r*0.5 - 7);
      ctx.lineTo(sx+3, -r*0.5);
      ctx.closePath(); ctx.fill();
    }
    /* head */
    ctx.fillStyle = '#7ab05a';
    ctx.beginPath(); ctx.arc(r*0.95, -r*0.25, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(r*0.95+2, -r*0.25-1, 1.5, 0, Math.PI*2); ctx.fill();
  } else if (e.type === 'garg'){
    /* GARG (gargoyle): stone head on a plinth, ember eyes, spits fireballs */
    const charging = e.cd > 0;
    /* plinth */
    ctx.fillStyle = '#5a6068';
    ctx.fillRect(-10, r*0.9, 20, r - r*0.9 + 8);
    ctx.fillStyle = '#4a5058';
    ctx.fillRect(-13, r*0.9 - 3, 26, 5);
    /* head */
    ctx.fillStyle = '#8a9098';
    ctx.beginPath();
    ctx.moveTo(-r*0.8, r*0.4);
    ctx.quadraticCurveTo(-r, -r*0.6, -r*0.4, -r*0.8);
    ctx.lineTo(r*0.4, -r*0.8);
    ctx.quadraticCurveTo(r, -r*0.6, r*0.8, r*0.4);
    ctx.closePath(); ctx.fill();
    /* horns */
    ctx.fillStyle = '#6a7078';
    ctx.beginPath();
    ctx.moveTo(-r*0.5, -r*0.7); ctx.lineTo(-r*0.9, -r*1.3); ctx.lineTo(-r*0.2, -r*0.9);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r*0.5, -r*0.7); ctx.lineTo(r*0.9, -r*1.3); ctx.lineTo(r*0.2, -r*0.9);
    ctx.closePath(); ctx.fill();
    /* ember eyes — brighter while charging a shot */
    const glow = charging ? 0.6 + 0.4*Math.sin(globalT*6) : 0.4;
    ctx.globalAlpha = Math.max(0.15, glow);
    ctx.fillStyle = '#ff7a2e';
    ctx.beginPath(); ctx.arc(-r*0.35, -r*0.25, 3.4, 0, Math.PI*2); ctx.arc(r*0.35, -r*0.25, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    /* muzzle glow just before it spits */
    if (charging && e.cd < 0.6){
      ctx.fillStyle = 'rgba(255,140,50,' + (0.5 + 0.5*Math.sin(globalT*12)).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(0, r*0.35, 4.5, 0, Math.PI*2); ctx.fill();
    }
  } else if (e.type === 'spik'){
    /* SPIK: spiky crawler — purple segmented body, pulsing pink spines */
    const pl = Math.sin(globalT*4 + e.t);
    ctx.fillStyle = '#8a4ad0';
    ctx.beginPath(); ctx.ellipse(0, 3, r, r*0.65, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#a86ae0';
    for (let i = 0; i < 4; i++){
      const sx = -r*0.7 + i*r*0.46;
      ctx.beginPath(); ctx.arc(sx, 3, r*0.42, 0, Math.PI*2); ctx.fill();
    }
    /* spines */
    ctx.fillStyle = '#ff6a9a';
    for (let i = 0; i < 5; i++){
      const sx = -r*0.8 + i*r*0.4;
      const h = 8 + pl*2.5 + (i % 2) * 3;
      ctx.beginPath();
      ctx.moveTo(sx-3, -r*0.3);
      ctx.lineTo(sx, -r*0.3 - h);
      ctx.lineTo(sx+3, -r*0.3);
      ctx.closePath(); ctx.fill();
    }
    /* head */
    ctx.fillStyle = '#c9a0ff';
    ctx.beginPath(); ctx.arc(r*0.85, 4, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(r*0.95, 3, 1.4, 0, Math.PI*2); ctx.fill();
    /* feet */
    ctx.strokeStyle = '#6a2aa0'; ctx.lineWidth = 3;
    const lp2 = Math.sin(globalT*9) * 2.5;
    ctx.beginPath();
    ctx.moveTo(-r*0.6, r*0.5); ctx.lineTo(-r*0.6, r*0.85 + lp2);
    ctx.moveTo(r*0.4, r*0.5); ctx.lineTo(r*0.4, r*0.85 - lp2);
    ctx.stroke();
  } else if (e.type === 'unic'){
    /* UNIC (Uni Uni): the little blue turtle — a domed teal shell, a small
     *head, stubby feet that paddle as it hops */
    ctx.fillStyle = '#3a9ad0';
    ctx.beginPath(); ctx.ellipse(0, 2, r, r*0.72, 0, 0, Math.PI*2); ctx.fill();
    /* shell plates */
    ctx.fillStyle = '#6ac8ff';
    for (let i = 0; i < 3; i++){
      const sx = -r*0.55 + i*r*0.55;
      ctx.beginPath(); ctx.arc(sx, 1, r*0.34, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#2a6a9a';
    for (let i = 0; i < 3; i++){
      const sx = -r*0.55 + i*r*0.55;
      ctx.beginPath(); ctx.arc(sx, 1, r*0.16, 0, Math.PI*2); ctx.fill();
    }
    /* head (peeks forward in the direction of travel) */
    const hd = e.dir < 0 ? -1 : 1;
    ctx.fillStyle = '#8ad4ff';
    ctx.beginPath(); ctx.arc(r*0.85*hd, 4, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(r*0.85*hd + 2*hd, 2.5, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(r*0.85*hd + 2.6*hd, 2.5, 1, 0, Math.PI*2); ctx.fill();
    /* paddling feet */
    ctx.strokeStyle = '#2a7ab0'; ctx.lineWidth = 2.6;
    const fp = Math.sin(globalT*9) * 2.4;
    ctx.beginPath();
    ctx.moveTo(-r*0.5, r*0.55); ctx.lineTo(-r*0.5, r*0.85 + fp);
    ctx.moveTo(r*0.35, r*0.55); ctx.lineTo(r*0.35, r*0.85 - fp);
    ctx.stroke();
  } else if (e.type === 'bomb'){
    /* BOMB (Bomb): a spiky mine — dark body, a ring of studs, and a
     *warning light on top that blinks red fast when you're close */
    /* stud ring */
    ctx.fillStyle = '#5a6070';
    for (let i = 0; i < 10; i++){
      const a = i/10*Math.PI*2 + e.t*0.6;
      const cx = Math.cos(a)*r*0.92, cy = Math.sin(a)*r*0.92;
      ctx.beginPath();
      ctx.moveTo(cx*0.55, cy*0.55 - 2);
      ctx.lineTo(cx*1.28, cy*1.28 - 2);
      ctx.lineTo(cx*0.85 + 3, cy*0.85 - 2);
      ctx.closePath(); ctx.fill();
    }
    /* body */
    ctx.fillStyle = e.hot ? (Math.sin(globalT*22) > 0 ? '#7a2a2a' : '#3a2a3a') : '#3a3f52';
    ctx.beginPath(); ctx.arc(0, 0, r*0.8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.beginPath(); ctx.arc(-r*0.28, -r*0.28, r*0.34, 0, Math.PI*2); ctx.fill();
    /* a single grumpy eye */
    ctx.fillStyle = e.hot ? '#ff5a4e' : '#c0c8e0';
    ctx.beginPath(); ctx.arc(r*0.2, -1, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a24';
    ctx.beginPath(); ctx.arc(r*0.2 + 1, -1, 1.5, 0, Math.PI*2); ctx.fill();
    /* warning light on top — blinks red when the player is close */
    const blink = e.hot ? (Math.sin(globalT*16) > 0) : (Math.sin(globalT*3 + e.t) > 0.6);
    ctx.fillStyle = blink ? '#ff5a4e' : '#7a2a20';
    ctx.beginPath(); ctx.arc(0, -r*0.85 - 3, 3.6, 0, Math.PI*2); ctx.fill();
    if (blink){
      ctx.fillStyle = 'rgba(255,90,78,0.35)';
      ctx.beginPath(); ctx.arc(0, -r*0.85 - 3, 8, 0, Math.PI*2); ctx.fill();
    }
  } else if (e.type === 'tire'){
    /* TIRE: a spiky construction tire — dark rubber ring, grey hub, studs
     *on the tread that rotate as it rolls */
    const spin = e.spin || 0;
    ctx.fillStyle = '#2a2e3a';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
    /* tread studs */
    ctx.fillStyle = '#8a94a8';
    for (let i = 0; i < 8; i++){
      const a = spin + i/8*Math.PI*2;
      ctx.beginPath();
      ctx.arc(Math.cos(a)*r*0.72, Math.sin(a)*r*0.72, 2.6, 0, Math.PI*2);
      ctx.fill();
    }
    /* hub */
    ctx.fillStyle = '#5a6070';
    ctx.beginPath(); ctx.arc(0, 0, r*0.45, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a3f52';
    for (let i = 0; i < 4; i++){
      const a = -spin*0.8 + i/4*Math.PI*2;
      ctx.beginPath();
      ctx.arc(Math.cos(a)*r*0.24, Math.sin(a)*r*0.24, 2.2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = '#8a94a8';
    ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, Math.PI*2); ctx.fill();
  } else if (e.type === 'dron'){
    /* DRON: a little propeller drone — round body, spinning rotor on top,
     *a single yellow eye */
    const rot = globalT*26;
    ctx.strokeStyle = '#8a94a8'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(0, -r*0.55); ctx.lineTo(0, -r*0.95); ctx.stroke();
    ctx.save();
    ctx.translate(0, -r*0.95);
    ctx.fillStyle = 'rgba(200,214,230,0.9)';
    for (let i = 0; i < 3; i++){
      const a = rot + i/3*Math.PI*2;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a)*r*0.55, Math.sin(a)*r*0.55*0.35, r*0.55, 2.4, a, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
    /* body */
    ctx.fillStyle = '#5a6880';
    ctx.beginPath(); ctx.ellipse(0, 2, r, r*0.78, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#7a8aa0';
    ctx.beginPath(); ctx.ellipse(-r*0.2, 0, r*0.5, r*0.4, 0, 0, Math.PI*2); ctx.fill();
    /* yellow eye */
    ctx.fillStyle = '#ffe23e';
    ctx.beginPath(); ctx.arc(r*0.3, 2, 3.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(r*0.3 + 1, 2, 1.6, 0, Math.PI*2); ctx.fill();
    /* little landing feet */
    ctx.strokeStyle = '#3a4050'; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(-r*0.5, r*0.7); ctx.lineTo(-r*0.65, r*0.95);
    ctx.moveTo(r*0.4, r*0.7); ctx.lineTo(r*0.55, r*0.95);
    ctx.stroke();
  } else if (e.type === 'cate'){
    /* CATE (Caterkiller): a spiky segmented crawler — four olive humps
     *with a crest of spikes, wiggling as it inches along */
    const wig = Math.sin(e.t*10) * 2.2;
    /* back legs */
    ctx.strokeStyle = '#3a4a2a'; ctx.lineWidth = 2.6;
    for (let i = 0; i < 4; i++){
      const lx = -r*0.85 + i*r*0.5;
      ctx.beginPath();
      ctx.moveTo(lx, r*0.4);
      ctx.lineTo(lx - 3, r*0.85);
      ctx.moveTo(lx, r*0.4);
      ctx.lineTo(lx + 3, r*0.85);
      ctx.stroke();
    }
    /* body segments, head to tail (dir = 1 faces right) */
    for (let i = 3; i >= 0; i--){
      const segX = (i - 1.5) * r*0.55 * e.dir;
      const segY = -i*0.6 + wig * (i%2 ? 1 : -1);
      const rad = r*(0.62 - i*0.07);
      /* spike crest on this segment */
      ctx.fillStyle = '#c8e070';
      for (let s = -1; s <= 1; s++){
        ctx.beginPath();
        ctx.moveTo(segX + s*rad*0.5 - 3, segY - rad*0.6);
        ctx.lineTo(segX + s*rad*0.5, segY - rad*1.25);
        ctx.lineTo(segX + s*rad*0.5 + 3, segY - rad*0.6);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = i === 0 ? '#90c060' : (i%2 ? '#7aa050' : '#86b058');
      ctx.beginPath(); ctx.arc(segX, segY, rad, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.arc(segX - rad*0.25, segY - rad*0.3, rad*0.4, 0, Math.PI*2); ctx.fill();
    }
    /* head eye (frontmost segment, i=0: segX = -1.5*r*0.55*dir, segY=0) */
    const hx = -1.5 * r*0.55 * e.dir;
    const hrad = r*0.62;
    ctx.fillStyle = '#1a2410';
    ctx.beginPath(); ctx.arc(hx + e.dir*hrad*0.35, -0.5, 2.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(hx + e.dir*hrad*0.35 + e.dir, -1, 1.1, 0, Math.PI*2); ctx.fill();
  } else if (e.type === 'hogg'){
    /* HOGG (Ball Hog): a spiky red ball — a ring of long spikes that whirl
     *fast on a charge, an angry face at the centre */
    const spin = e.spin || 0;
    /* spike ring */
    ctx.fillStyle = e.hot ? '#ffd23e' : '#c85a40';
    for (let i = 0; i < 10; i++){
      const a = spin + i/10*Math.PI*2;
      const bx = Math.cos(a)*r*0.72, by = Math.sin(a)*r*0.72;
      const tx = Math.cos(a)*r*1.25, ty = Math.sin(a)*r*1.25;
      ctx.beginPath();
      ctx.moveTo(bx - Math.sin(a)*2.4, by + Math.cos(a)*2.4);
      ctx.lineTo(tx, ty);
      ctx.lineTo(bx + Math.sin(a)*2.4, by - Math.cos(a)*2.4);
      ctx.closePath(); ctx.fill();
    }
    /* body */
    ctx.fillStyle = e.hot ? '#ff6a50' : '#c8402e';
    ctx.beginPath(); ctx.arc(0, 0, r*0.78, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.beginPath(); ctx.arc(-r*0.26, -r*0.26, r*0.32, 0, Math.PI*2); ctx.fill();
    /* angry eyes + brows */
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(r*0.16, -1.5, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.52, -0.5, 2.8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a24';
    ctx.beginPath(); ctx.arc(r*0.2, -1.3, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.55, -0.3, 1.4, 0, Math.PI*2); ctx.fill();
    /* angry brows */
    ctx.strokeStyle = '#2a1a14'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(r*0.02, -4.5); ctx.lineTo(r*0.3, -2.6);
    ctx.moveTo(r*0.42, -3.2); ctx.lineTo(r*0.68, -1.6);
    ctx.stroke();
    /* hub */
    ctx.fillStyle = '#3a2420';
    ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
  const tagCol = {fee:'#ffb08a', stop:'#ff8a7a', lag:'#e8c07a', slip:'#c99aff',
                  spam:'#80ffc0', wick:'#fff2a0', pump:'#ffb060', rug:'#c9a0ff',
                  drop:'#ffb060', crab:'#ff8a4a', roll:'#c0c8e0', spik:'#d08aff',
                  hide:'#c9e08a', jaws:'#8ad0e0', unid:'#a0d080', garg:'#c0b8a8',
                  unic:'#6ac8ff', bomb:'#ff8a7a', tire:'#c0c8e0', dron:'#ffe23e',
                  cate:'#90c060', hogg:'#ff6a50'}[e.type] || '#c99aff';
  tag(x, y - r*2 - 12, enemyName(e), tagCol);
}

/* ---------- the hero ---------- */
function drawPlayer(){
  const p = player;
  if (p.dying && dieT > 0.9) return;
  const f = p.face;
  const showSpin = p.roll || (!p.ground && (Math.abs(p.vx) > 60 || p.vy < -60)) || p.dying;
  const blink = p.inv > 0 && Math.sin(globalT*30) > 0;
  if (blink) return;
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.squash > 0){
    const q = p.squash / 0.16;
    ctx.scale(1 + 0.25*q, 1 - 0.22*q);
  }
  ctx.scale(f, 1);

  if (showSpin){
    /* spin ball */
    ctx.rotate(p.spinT * (f>0?1:1));
    ctx.fillStyle = '#3050e8';
    ctx.beginPath(); ctx.arc(0, -14, 14, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#1d34a8'; ctx.lineWidth = 3;
    for (let i=0;i<3;i++){
      const a0 = p.spinT*2 + i*2.09;
      ctx.beginPath(); ctx.arc(0, -14, 10.5, a0, a0+1.1); ctx.stroke();
    }
    ctx.fillStyle = '#ff5a4e';
    ctx.beginPath(); ctx.arc(0, -9, 5.5, 0, Math.PI*2); ctx.fill();
    /* motion streaks */
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2;
    for (let i=0;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(-16-i*4, -20+i*6);
      ctx.lineTo(-26-i*4, -20+i*6);
      ctx.stroke();
    }
  } else {
    /* body run / idle */
    const t = p.animT;
    const run = Math.abs(p.vx) > 40 && p.ground;
    const bob = run ? Math.sin(t*16)*1.6 : Math.sin(globalT*2.4)*1.2;
    const leg = run ? Math.sin(t*16)*4 : 0;
    /* back spikes */
    ctx.fillStyle = '#1d34a8';
    ctx.beginPath();
    ctx.moveTo(-6, -20+bob);
    ctx.lineTo(-17, -24+bob); ctx.lineTo(-8, -15+bob);
    ctx.lineTo(-18, -14+bob); ctx.lineTo(-7, -10+bob);
    ctx.lineTo(-15, -6+bob);  ctx.lineTo(-4, -6+bob);
    ctx.closePath(); ctx.fill();
    /* head */
    ctx.fillStyle = '#3050e8';
    ctx.beginPath(); ctx.arc(1, -17+bob, 10.5, 0, Math.PI*2); ctx.fill();
    /* ear */
    ctx.fillStyle = '#1d34a8';
    ctx.beginPath();
    ctx.moveTo(-3, -27+bob); ctx.lineTo(-6, -32+bob); ctx.lineTo(1, -28+bob);
    ctx.closePath(); ctx.fill();
    /* face */
    ctx.fillStyle = '#ffe6c7';
    ctx.beginPath(); ctx.ellipse(7, -14+bob, 6.5, 5.5, 0.2, 0, Math.PI*2); ctx.fill();
    /* eye */
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(6, -19+bob, 3.6, 4.4, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath(); ctx.arc(7.4, -18.6+bob, 1.9, 0, Math.PI*2); ctx.fill();
    /* THE redbelly */
    ctx.fillStyle = '#ff5a4e';
    ctx.beginPath(); ctx.ellipse(3, -9+bob, 6, 5, 0.3, 0, Math.PI*2); ctx.fill();
    /* gloves */
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-3+leg*0.5, -11+bob, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7-leg*0.5, -10+bob, 3.4, 0, Math.PI*2); ctx.fill();
    /* shoes */
    ctx.fillStyle = '#e8352b';
    roundRect(-9+leg, -5, 9, 5, 2.5); ctx.fill();
    roundRect(1-leg, -5, 9, 5, 2.5); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-9+leg, -5, 9, 2);
    ctx.fillRect(1-leg, -5, 9, 2);
  }
  ctx.restore();
}

/* ---------- HUD ---------- */
function fmtTime(t){
  const m = Math.floor(t/60);
  const s = Math.floor(t%60);
  const c = Math.floor((t*100)%100);
  return m + ':' + String(s).padStart(2,'0') + '.' + String(c).padStart(2,'0');
}
function rankFor(t){
  /* seven zones: the naive bot runs ~145s, so S is a real challenge */
  if (t <= 160) return ['S','#ffd23e'];
  if (t <= 185) return ['A','#45e05a'];
  if (t <= 210) return ['B','#4aa3ff'];
  if (t <= 245) return ['C','#9aa7b8'];
  return ['D','#ff5a4e'];
}
function drawHUD(){
  ctx.textAlign = 'left';
  ctx.font = 'bold 20px Consolas, monospace';
  ctx.fillStyle = 'rgba(16,24,34,0.55)';
  roundRect(12, 10, 190, 62, 8); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px Consolas, monospace';
  ctx.fillText('TIME ' + fmtTime(time), 24, 34);
  /* rings */
  drawRingMini(34, 56);
  ctx.font = 'bold 18px Consolas, monospace';
  ctx.fillStyle = '#8effa8';
  ctx.fillText(String(player.rings).padStart(2,'0'), 48, 61);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = 'bold 11px Consolas, monospace';
  ctx.fillText('/ ' + TOTAL_RINGS, 84, 61);
  /* lives */
  for (let i=0;i<Math.max(0,lives);i++){
    ctx.fillStyle = '#3050e8';
    ctx.beginPath(); ctx.arc(140+i*16, 55, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff5a4e';
    ctx.beginPath(); ctx.arc(142+i*16, 57, 3, 0, Math.PI*2); ctx.fill();
  }
  /* best */
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(16,24,34,0.55)';
  roundRect(VIEW_W-172, 10, 160, 30, 8); ctx.fill();
  ctx.fillStyle = best ? '#ffd23e' : 'rgba(255,255,255,0.5)';
  ctx.font = 'bold 15px Consolas, monospace';
  ctx.fillText('BEST ' + (best ? fmtTime(best) : '--:--.--'), VIEW_W-24, 30);
  /* score */
  ctx.fillStyle = 'rgba(16,24,34,0.55)';
  roundRect(VIEW_W-172, 44, 160, 28, 8); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Consolas, monospace';
  ctx.fillText('SCORE ' + score, VIEW_W-24, 63);
  /* progress bar */
  const bx = VIEW_W/2 - 130, by = 14, bw = 260, bh = 8;
  ctx.fillStyle = 'rgba(16,24,34,0.4)';
  roundRect(bx, by, bw, bh, 4); ctx.fill();
  /* zone 7 has no goal gate — the bar shows Robotnik's remaining hits */
  const prog = (stage === 6 && BOSS)
    ? (BOSS.hp / BOSS.maxHp)
    : Math.max(0, Math.min(1, player.x / GOAL_X));
  ctx.fillStyle = 'rgba(79,209,89,0.9)';
  roundRect(bx, by, Math.max(6,bw*prog), bh, 4); ctx.fill();
  for (const c of CHECKPOINTS){
    ctx.fillStyle = c.on ? '#4fd159' : 'rgba(255,255,255,0.7)';
    ctx.fillRect(bx + bw*(c.x/GOAL_X)-1, by-2, 2, bh+4);
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('🏁', bx+bw, by-3);
  /* zone label */
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = 'bold 10px Consolas, monospace';
  ctx.textAlign = 'right';
  ctx.fillText('Z' + (stage+1) + ' · ' + STAGES[stage].name, bx-10, by+8);
  /* zone 7: Robotnik's hit pips */
  if (stage === 6 && BOSS){
    ctx.font = 'bold 11px Consolas, monospace';
    ctx.fillStyle = BOSS.dead ? '#54e07a' : '#ff6a5e';
    ctx.fillText(BOSS.dead ? 'ROBOTNIK — DOWN' : 'ROBOTNIK', VIEW_W - 24, 84);
    for (let i = 0; i < BOSS.maxHp; i++){
      ctx.fillStyle = i < BOSS.hp ? '#ff5a4e' : 'rgba(255,255,255,0.25)';
      ctx.fillRect(VIEW_W - 24 - (i + 1) * 13, 90, 10, 10);
    }
  }
  /* dash charge pips */
  if (player.charge > 0){
    for (let i=0;i<3;i++){
      ctx.fillStyle = i < player.charge ? '#ffe23e' : 'rgba(255,255,255,0.3)';
      roundRect(VIEW_W/2 - 30 + i*22, 34, 16, 6, 3); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = 'bold 10px Consolas, monospace';
    ctx.fillText('SPIN DASH', VIEW_W/2, 52);
  }
}
function drawRingMini(x, y){
  ctx.strokeStyle = '#37d95f';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(x, y, 7*Math.abs(Math.cos(globalT*5)) + 2, 7, 0, 0, Math.PI*2); ctx.stroke();
}

/* ---------- screens ---------- */
function drawStageClear(){
  ctx.fillStyle = 'rgba(4,8,18,0.55)';
  ctx.fillRect(0,0,VIEW_W,VIEW_H);

  ctx.fillStyle = '#4aa3ff';
  roundRect(cx-bw/2, 286, Math.max(6, bw*Math.min(1, stClearT/2.4)), 6, 3); ctx.fill();
}
function drawCenterPanel(title, lines){

function drawTitle(){
  ctx.fillStyle = 'rgba(10,18,28,0.55)';
  ctx.fillRect(0,0,VIEW_W,VIEW_H);
  ctx.textAlign = 'center';
  const ty = 150 + Math.sin(globalT*1.6)*6;
  ctx.font = 'bold 56px Consolas, monospace';
  ctx.fillStyle = '#1d34a8';
  ctx.fillText('REDBELLY RUN', VIEW_W/2+3, ty+3);
  ctx.fillStyle = '#4fd159';
  ctx.fillText('REDBELLY RUN', VIEW_W/2, ty);
  ctx.font = 'bold 16px Consolas, monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('seven zones: HILL → MARBLE → SPRING YARD → LABYRINTH → STAR LIGHT', VIEW_W/2, ty+40);
  ctx.fillText('SCRAP BRAIN → FINAL ZONE', VIEW_W/2, ty+56);
  ctx.fillText('dodge bad trades, cash out fast', VIEW_W/2, ty+72);

  ctx.font = 'bold 14px Consolas, monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  const cx = VIEW_W/2;
  const L = [
    ['A / D', 'move'],
    ['W / SPACE', 'jump (hold = higher)'],
    ['SHIFT ×3', 'spin dash (tap, tap, tap, release)'],
    ['S', 'drop through platforms'],

  L.forEach((r,i)=>{

      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(r[1], cx-8, y);
    } else {
      /* all-green inline row: center the whole list */
      const gap = 26;
      const widths = r.map(t=>ctx.measureText(t).width);
      let x = cx - (widths.reduce((a,b)=>a+b,0) + gap*(r.length-1)) / 2;
      ctx.textAlign = 'left';
      ctx.fillStyle = '#8effa8';
      r.forEach((t,j)=>{ ctx.fillText(t, x, y); x += widths[j] + gap; });
    }
  });
  if (Math.sin(globalT*4) > -0.3){
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px Consolas, monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(IS_TOUCH ? 'TAP OR PRESS ENTER' : 'PRESS ENTER', cx, 456);

    ctx.font = 'bold 12px Consolas, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';

  if (best > 0){

}
function drawGameOver(){
  ctx.fillStyle = 'rgba(20,10,10,0.7)';
  ctx.fillRect(0,0,VIEW_W,VIEW_H);

  if (best > 0) ctx.fillText('best ' + fmtTime(best), VIEW_W/2, 286);
  if (Math.sin(globalT*4) > -0.3){
    ctx.font = 'bold 22px Consolas, monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('PRESS R TO RETRY', VIEW_W/2, 340);
  }
}
function drawWin(){
  ctx.fillStyle = 'rgba(10,20,14,0.7)';
  ctx.fillRect(0,0,VIEW_W,VIEW_H);
  const cx = VIEW_W/2;
  ctx.textAlign = 'center';
  ctx.font = 'bold 46px Consolas, monospace';
  ctx.fillStyle = '#4fd159';
  ctx.fillText('CASHED OUT!', cx, 190);
  ctx.font = 'bold 34px Consolas, monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText(fmtTime(time), cx, 240);
  const [rk, col] = rankFor(time);
  const pop = 1 + 0.15*Math.max(0, Math.sin(winT*5 - winT));
  ctx.save();
  ctx.translate(cx + 170, 235);
  ctx.scale(pop, pop);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#10202c';
  ctx.font = 'bold 40px Consolas, monospace';
  ctx.fillText(rk, 0, 14);
  ctx.restore();
  ctx.font = 'bold 16px Consolas, monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('green options ' + ringsTotal + ' / ' + TOTAL_RINGS + '   ·   score ' + score, cx, 300);
  if (bestBeaten && Math.sin(globalT*5) > -0.3){
    ctx.fillStyle = '#ffd23e';
    ctx.font = 'bold 18px Consolas, monospace';
    ctx.fillText('★ NEW BEST TIME ★', cx, 330);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = 'bold 13px Consolas, monospace';
  ctx.fillText('S < 160s   A < 185s   B < 210s   C < 245s', cx, 360);
  if (Math.sin(globalT*4) > -0.3){
    ctx.font = 'bold 20px Consolas, monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('PRESS R TO RUN IT BACK', cx, 410);
  }
}

/* ---------------- main loop ---------------- */
let lastT = 0, acc = 0;
const FIXED = 1/60;
let loopErrT = 0;
function frame(t){
  let dt = (t - lastT) / 1000;
  if (!(dt > 0) || dt > 0.1) dt = 0.016;
  lastT = t;
  acc += dt;
  try {
    // epsilon keeps the accumulator immune to float jitter (some browsers
    // hand us integer-millisecond rAF timestamps; 16ms frames then miss the
    // 16.67ms step boundary by a couple of ulps)
    while (acc >= FIXED - 1e-7){
      step(FIXED);
      acc -= FIXED;
      if (acc < -1e-6) acc = 0;
    }
    render();
  } catch (err){
    /* NEVER let a single-frame exception kill the rAF chain — that would
       freeze the whole game. Log once, flash a banner (drawn at the end of
       render) and keep the loop alive; R restarts the run. */
    if (loopErrT <= 0) console.error('[Redbelly] frame error:', err);
    loopErrT = 4;
  }
  if (loopErrT > 0) loopErrT -= dt;
  requestAnimationFrame(frame);
}
resetWorld();
requestAnimationFrame(frame);

/* dev/QA hooks: ?autostart  ?x=3000 (teleport)  ?stage=2..7 (start in that
   zone: 2=MARBLE 3=SPRING YARD 4=LABYRINTH 5=STAR LIGHT 6=SCRAP BRAIN
   7=FINAL ZONE)  ?win=1 (in zones 1-6: carry into the final zone; in the
   FINAL ZONE: 1 HP left on Robotnik, one stomp wins)  ?boost=1 (initial vx,
   e.g. to cross a gate for screenshots)  ?t=NN (advance globalT for machine
   phases, e.g. ?t=1 puts ceiling piston 1 mid-slam)  ?state=win (force a
   game state for screenshots: win / stclear / gameover)
   e.g. index.html?autostart&x=1650   /   index.html?autostart&stage=7&t=1 */
if (typeof location !== 'undefined' && location.search) {
  const qs = new URLSearchParams(location.search);
  if (qs.has('autostart')) {
    startRun();
    const st = parseInt(qs.get('stage'));
    if (st >= 2 && st <= STAGES.length){ loadStage(st-1); startStageMusic(st-1); }
    const tx = parseFloat(qs.get('x'));
    if (!Number.isNaN(tx)) {
      player.x = Math.max(30, Math.min(WORLD_W - 40, tx));
      const gh = groundHeight(player.x);
      player.y = gh !== null ? gh : 470; // land on raised/lowered ground
    }
    if (qs.get('win') === '1') {
      if (stage !== STAGES.length - 1) loadStage(STAGES.length - 1); // final zone
      if (STAGES[stage].boss && BOSS){
        /* final zone: one stomp wins it — stand right above the boss */
        BOSS.hp = 1;
        player.x = BOSS.x; player.y = BOSS.y - 90;
        player.vx = 0; player.vy = 0;
      } else {
        player.x = GOAL_X - 14;
        player.y = 460;
        player.vx = 420; // carry us across the CASH OUT line
      }
    }
    if (qs.get('boost') === '1') player.vx = 420;
    const tg = parseFloat(qs.get('t'));
    if (isFinite(tg) && tg > 0) globalT = tg;
    if (qs.get('orbs') === '1' && BOSS_ORBS){
      /* deterministic orb columns for screenshots */
      BOSS_ORBS.push({x:620, y:230},{x:620, y:270},{x:620, y:310});
      BOSS_ORBS.push({x:1240, y:190},{x:1240, y:230},{x:1240, y:270});
    }
    const stForce = qs.get('state');
    if (stForce === 'win' || stForce === 'stclear' || stForce === 'gameover'){
      state = stForce;
    }
    if (!Number.isNaN(tx) || qs.get('win') === '1' || st === 2) {
      // snap the camera so the player is in view (avoids a long pan-in)
      camX = Math.max(0, Math.min(WORLD_W - VIEW_W + 60, player.x - VIEW_W*0.42));
      camY = 140;
    }
  }
}

/* ?dbg=N — QA: after N seconds of game time, dump a state snapshot to
   document.title (capture with --dump-dom) and the console. */
if (typeof location !== 'undefined' && location.search){
  const dbgAt = parseFloat(new URLSearchParams(location.search).get('dbg') || '');
  if (isFinite(dbgAt) && dbgAt > 0){
    const snap = () => {
      const s = JSON.stringify({
        state, stage, px: Math.round(player.x), py: Math.round(player.y),
        camX: Math.round(camX), camY: Math.round(camY),
        walls: WALLS.length, spikes: SPIKES.length, pends: PENDS.length,
        enemies: ENEMIES.length, time: +globalT.toFixed(2)
      });
      document.title = 'RBDBG ' + s;
      console.log('RBDBG ' + s);
    };
    const tick = () => {
      if (globalT >= dbgAt) snap(); else requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
}

/* ---------------- test hook (used by headless harness) ---------------- */
if (typeof window !== 'undefined'){
  window.__RB = {
    get state(){ return state; },
    get player(){ return player; },
    get time(){ return time; },
    get lives(){ return lives; },
    get best(){ return best; },
    get stage(){ return stage; },
    get ringsTotal(){ return ringsTotal; },
    keys,
    startRun,
    loadStage,
    step,
    render,
    damage,
    killPlayer,
    teleport(x, y){ player.x = x; if (y !== undefined) player.y = y; player.vx = 0; player.vy = 0; },
    setLives(n){ lives = n; },
    killAllEnemies(){ ENEMIES.forEach(e => e.dead = true); },
    /* zone 7 QA: boss + machine state (null outside FINAL ZONE) */
    bossZone(){
      if (!BOSS) return null;
      return {
        x: BOSS.x, y: BOSS.y, hp: BOSS.hp, inv: BOSS.inv, dead: BOSS.dead,
        slots: BOSS.slots, slot: BOSS.slot,
        orbs: BOSS_ORBS.map(o => ({x: o.x, y: o.y})),
        cpists: CPISTS.map(c => ({x: c.x, ext: c.ext, warn: c.warn})),
      };
    },
  };
}
