"use strict";
/* ============================================================
   REDBELLY RUN — a seven-zone, self-contained "Sonic-style"
   waiting-room dash.
   Zone 1 HILL: run right, grab green options (rings), dodge
   bad trades (enemies). Zone 2 MARBLE: a dark crystal cavern with a
   giant glowing crystal core and lava pits, new bad trades. Zone 3
   SPRING YARD: a dusk city pinball amusement park — maroon brick
   platforms, green wire fencing, neon signs, pinball bumpers and
   roaming iron balls. Zone 4 LABYRINTH: a flooded ruin of yellow
   bricks and murky water — sliding stone walls, floor spikes and
   swinging iron balls, plus Burrobots, Jaws, Unidus and
   fire-spitting gargoyles. Zone 5 STAR LIGHT: a highway
   construction site under a starry night — street lamps, girders
   and traffic cones, fans that blast you backwards and seesaws that
   fling you up, plus Uni Uni turtles, Bomb mines, spiky tires and
   propeller drones. Zone 6 SCRAP BRAIN: the polluted exterior of
   Dr. Eggman's industrial base — smog and billowing smoke, blinking
   warning lights, rusted pipes and gears, ground flame jets, conveyor
   belts that carry you (some backwards) and dropping platforms, plus
   Caterkillers, charging Ball Hogs, Bomb mines and leaping Burrobots.
   Zone 7 FINAL ZONE: the original's single-act boss room — the Egg
   Crusher at the heart of Scrap Brain: four crusher pistons (two
   ceiling, two floor), Robotnik riding the floor pistons, energy orbs
   dropping from the ceiling. Stomp his head eight times to win; no
   rings, no going back (the door closes behind you).
   Cash out as fast as you can. Cheat code: F+G+H (held together)
   cuts to the next zone — in FINAL ZONE it goes straight to CASH
   OUT. No external assets: all art is drawn, all audio is synthesized
   (optional music1.mp3 … music7.mp3 drop-ins override per zone).
   ============================================================ */

  canvas.height = Math.round(VIEW_H * dpr);
  const s = Math.min(window.innerWidth  / VIEW_W, window.innerHeight / VIEW_H);
  canvas.style.width  = Math.floor(VIEW_W * s) + 'px';
  canvas.style.height = Math.floor(VIEW_H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

function applyStage(i){
  stage = i;

  TERRAIN = S.terrain; PLATFORMS = S.platforms; SPRINGS = S.springs;
  CHECKPOINTS = S.checkpoints; RINGS = S.rings; ENEMIES = S.enemies;

  FJETS = (S.fjets || []).map(f=>({...f, cd:0})); BELTS = S.belts || [];

  CPISTS = (S.cpists || []).map(c => ({...c, ext:false, warn:false}));
  CEIL = S.ceil || null;
  doorClosed = false; doorT = 0; orbQueue = 0; orbQT = 0;
  BOSS_ORBS.length = 0;
  BOSS = S.boss ? {
    x: S.boss.slots[0], y: S.boss.slotY, slots: S.boss.slots,
    slot: 0, hp: S.boss.hp, maxHp: S.boss.hp, inv: 0, swapT: 8,

  PITS = [];

    if (b - a > 40) PITS.push({ a, b, y: Math.max(TERRAIN[k][3], TERRAIN[k+1][1]) + 18 });
  }

  BUMPERS.forEach(b=>{ b.t = 0; b.cd = 0; });
  ORBS.forEach(o=>{ o.cd = 0; o.x = o.cx; o.y = o.cy; });
  CHECKPOINTS.forEach(c=>c.on=false);
  RINGS.forEach(r=>r.got=false);
  ENEMIES.forEach((e,idx)=>{
    e.dead = false;
    e.x = (e.a !== undefined) ? (e.a+e.b)/2 : e.x;
    e.y = e.base !== undefined ? e.base : (e.y0 !== undefined ? e.y0 : 480);
    e.t = Math.random()*6;

function platDown(pl){
  return pl.dp !== undefined && Math.sin(globalT * 0.9 + pl.ph) < -0.55;
}
/* zone 7: a column of three energy orbs drops from the ceiling,
   offset from the boss's current slot (that's where you want to be) */
function spawnOrbColumn(nearX){
  let x = 420 + Math.random() * 920, tries = 0;
  while (Math.abs(x - nearX) < 110 && tries++ < 8) x = 420 + Math.random() * 920;
  for (let k = 0; k < 3; k++) BOSS_ORBS.push({x: x, y: 150 + k * 40});
}
function groundHeight(x){
  for (let i = 0; i < TERRAIN.length; i++){
    const s = TERRAIN[i];
    if (x >= s[0] && x <= s[2]){
      const t = (s[2] === s[0]) ? 0 : (x - s[0]) / (s[2] - s[0]);
      return s[1] + (s[3] - s[1]) * t;
    }
  }
  return null; // pit
}

  p.x = START.x; p.y = START.y; p.vx = 0; p.vy = 0;

  p.coyote = 0; p.inv = 2.5; p.dropT = 0; p.spinT = 0; p.squash = 0;

   gate and the F+G+H cheat code. */
function advanceStage(){
  if (stage < STAGES.length - 1){
    state = 'stclear';
    stClearT = 0;
    AudioSys.stageClear();
    burst(player.x, player.y-20, 20, '#7ee8ff', 240);
  } else {
    state = 'win'; screenAt = performance.now();
    winT = 0;
    AudioSys.win();
    if (best === 0 || time < best){
      best = time; bestBeaten = true;
      localStorage.setItem('rb_run_best', String(best));
    }
    burst(player.x, player.y-20, 26, '#54e07a', 260);
  }
}

    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f0, t0);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1), t0 + o.dur);
    g.gain.setValueAtTime(o.gain || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + o.dur);
    osc.connect(g); g.connect(o.dest || this.sfxGain);
    osc.start(t0); osc.stop(t0 + o.dur + 0.05);
  },
  jump(){ this.tone({f0:340,f1:760,dur:0.14,gain:0.16}); },
  ring(combo){
    const f = 1568 * Math.pow(1.059, Math.min(combo,12));
    this.tone({f0:f,dur:0.06,type:'sine',gain:0.22});
    this.tone({f0:f*1.5,dur:0.14,type:'sine',gain:0.16,at:0.05});
  },
  stomp(){ this.tone({f0:220,f1:50,dur:0.16,type:'square',gain:0.25});
           this.tone({f0:1200,f1:400,dur:0.08,type:'triangle',gain:0.12}); },
  hurt(){ this.tone({f0:320,f1:70,dur:0.35,type:'sawtooth',gain:0.22}); },
  spring(){ this.tone({f0:240,f1:940,dur:0.24,type:'square',gain:0.16}); },
  bump(){ this.tone({f0:320,f1:980,dur:0.16,type:'square',gain:0.12}); this.tone({f0:160,f1:60,dur:0.1,type:'triangle',gain:0.14,at:0.02}); },
  checkpoint(){ [660,880,1100].forEach((f,i)=>this.tone({f0:f,dur:0.12,type:'triangle',gain:0.2,at:i*0.09})); },
  dashTick(l){ this.tone({f0:560+180*l,dur:0.05,type:'square',gain:0.12}); },
  dashLaunch(){ this.tone({f0:180,f1:900,dur:0.2,type:'square',gain:0.16}); },
  land(){ this.tone({f0:140,f1:60,dur:0.09,type:'sine',gain:0.2}); },
  death(){ this.tone({f0:420,f1:50,dur:0.6,type:'sawtooth',gain:0.22}); },
  win(){ [523,659,784,1047].forEach((f,i)=>this.tone({f0:f,dur:0.22,type:'triangle',gain:0.24,at:i*0.14})); },
  stageClear(){ [659,784,988,1319,1568].forEach((f,i)=>this.tone({f0:f,dur:0.16,type:'triangle',gain:0.2,at:i*0.09})); },
  /* --- background loop: ORIGINAL fast chiptune, 8 bars of 16ths, 168 BPM.
     All notes original (composed for this game; not a licensed track).
     Optional: drop a legally-licensed music.mp3/.ogg/.wav/.m4a next to
     index.html and it overrides this loop automatically (see tryFileMusic). */
  NF(n){ return 440 * Math.pow(2,(n-69)/12); },
  /* lead — 8 bars: Am F C E | Am Dm E C (16 sixteenth slots per bar).
     Cave zone plays the same song slower (128 BPM) and transposed -4. */
  lead: [
    69,69,72,72,76,76,72,72,69,72,76,81,79,79,76,76,
    77,77,74,74,71,71,74,74,72,77,76,72,69,69,69,69,
    72,72,76,76,79,79,76,76,74,76,77,76,72,72,76,76,
    76,76,79,79,83,83,79,79,76,79,83,79,76,76,76,76,
    81,81,79,79,76,76,79,79,81,84,83,79,76,76,79,79,
    74,74,77,77,81,81,77,77,77,81,79,77,74,74,77,77,
    76,76,80,80,83,83,80,80,76,80,83,80,83,83,83,83,
    72,72,76,76,79,79,83,83,84,84,83,81,79,79,76,76,
  ],
  /* bass — 8th-note root/fifth pump */
  bass: [
    45,null,45,null,52,null,45,null,45,null,45,null,52,null,45,null,
    41,null,41,null,48,null,41,null,41,null,41,null,48,null,41,null,
    48,null,48,null,55,null,48,null,48,null,48,null,55,null,48,null,
    40,null,40,null,47,null,40,null,40,null,40,null,47,null,40,null,
    45,null,45,null,52,null,45,null,45,null,45,null,52,null,45,null,
    38,null,38,null,45,null,38,null,38,null,38,null,45,null,38,null,
    40,null,40,null,47,null,40,null,40,null,40,null,47,null,40,null,
    48,null,48,null,55,null,48,null,48,null,48,null,55,null,48,null,
  ],
  startMusic(){
    if (!this.ctx) return;
    this.step = 0;
    this.next = this.ctx.currentTime + 0.1;
    const me = this;
    const playStep = (st)=>{
      const bar = (st/16)|0, pos = st % 16;
      const l = me.lead[st], b = me.bass[st];
      if (l !== null){
        me.tone({f0:me.NF(l + me.synthTr),dur:0.13,type:'square',gain:0.05,dest:me.musicGain});
        me.tone({f0:me.NF(l + 12 + me.synthTr),dur:0.09,type:'square',gain:0.02,dest:me.musicGain});
      }
      if (b !== null) me.tone({f0:me.NF(b + 12 + me.synthTr),dur:0.16,type:'triangle',gain:0.11,dest:me.musicGain});
      /* drums: 8th hats, 4-on-2 kick/snare, fill into the loop */
      if (pos % 2 === 0) me.tone({f0:7000,dur:0.03,type:'square',gain:0.018,dest:me.musicGain});
      if (pos === 0 || pos === 8) me.tone({f0:130,f1:45,dur:0.12,type:'sine',gain:0.14,dest:me.musicGain});
      if (pos === 4 || pos === 12 || (bar === 7 && (pos === 14 || pos === 15))){
        me.tone({f0:220,f1:90,dur:0.08,type:'triangle',gain:0.09,dest:me.musicGain});
        me.tone({f0:3000,dur:0.05,type:'square',gain:0.025,dest:me.musicGain});
      }
    };
    const schedule = ()=>{
      if (me.muted) { me.next = me.ctx.currentTime + 0.1; return; }
      while (me.next < me.ctx.currentTime + 0.3){
        playStep(me.step);
        me.step = (me.step + 1) % 128;
        me.next += 60 / me.tempo / 4; // per-tick: tempo may change per zone
      }
    };
    if (this.musicTimer) clearInterval(this.musicTimer);
    this.musicTimer = setInterval(schedule, 90);
  },
  toggleMute(){
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.8;
    if (this.muted) this.next = this.ctx ? this.ctx.currentTime + 0.1 : 0;
    if (fileMusic) fileMusic.muted = this.muted;
  }
};

/* Optional drop-in music (per zone): music1.mp3 for HILL … music7.mp3
   for FINAL ZONE — placed next to index.html. A found file replaces the
   built-in synth loop for its zone; if absent, the synth loop plays. */
let fileMusic = null;
function startStageMusic(i){
  if (fileMusic){ try { fileMusic.pause(); } catch(e){} fileMusic = null; }
  const a = new Audio('music' + (i+1) + '.mp3');
  a.preload = 'auto'; a.loop = true; a.volume = 0.6; a.muted = AudioSys.muted;
  a.addEventListener('canplay', () => {
    if (fileMusic) return; // a newer zone already took over
    fileMusic = a;
    /* file found: stop the built-in synth loop so they don't play together */
    if (AudioSys.musicTimer){ clearInterval(AudioSys.musicTimer); AudioSys.musicTimer = null; }
    a.play().catch(()=>{});
  }, {once:true});
  a.addEventListener('error', () => { AudioSys.startMusic(); }, {once:true});
}

/* ---------------- input ---------------- */
const keys = {left:false,right:false,down:false,jump:false,dash:false};
let jumpBuf = 0, jumpHeld = false, dashArmed = false;
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left',
  ArrowRight:'right', KeyD:'right',
  ArrowDown:'down', KeyS:'down',
  Space:'jump', ArrowUp:'jump', KeyW:'jump', KeyK:'jump',
  ShiftLeft:'dash', ShiftRight:'dash', KeyX:'dash', KeyJ:'dash',
};
function ensureAudio(){
  AudioSys.init();
  if (AudioSys.ctx && AudioSys.ctx.state === 'suspended') AudioSys.ctx.resume();
}
function onKeyDown(e){
  const k = e.code;
  if (k in KEYMAP || k==='Space' || k.startsWith('Arrow') || k==='KeyF' || k==='KeyG' || k==='KeyH') e.preventDefault();
  ensureAudio();
  const name = KEYMAP[k];
  if (name === 'jump' && !keys.jump){ keys.jump = true; jumpBuf = JBUF; }
  else if (name === 'dash' && !keys.dash){ keys.dash = true; dashEdge = true; }
  else if (name) keys[name] = true;
  if (k==='Enter'){ if (state==='title' || state==='win' || state==='gameover') startRun(); }
  if (k==='KeyR'){ if (state!=='title') startRun(); }
  if (k==='KeyM'){ AudioSys.toggleMute(); showFlash('MUTED', 0.8); }
  if (k==='Escape' || k==='KeyP'){
    if (state==='play'){ state = 'paused'; if (fileMusic) fileMusic.pause(); }
    else if (state==='paused'){ state = 'play'; if (fileMusic) fileMusic.play().catch(()=>{}); }
  }
  /* F+G+H cheat: skip to the next zone (final zone: CASH OUT) */
  if (k==='KeyF') cheatKeys.F = true;
  if (k==='KeyG') cheatKeys.G = true;
  if (k==='KeyH') cheatKeys.H = true;
  if (cheatKeys.F && cheatKeys.G && cheatKeys.H && !cheatLatched){
    cheatLatched = true;
    if (state === 'play'){
      const goingIn = stage < STAGES.length - 1;
      showFlash(goingIn ? 'CUT → ' + STAGES[stage+1].name : 'CUT → CASH OUT', 1.4);
      advanceStage();
    }
  }
}
function onKeyUp(e){
  const k = e.code;
  const name = KEYMAP[k];
  if (name === 'jump' && keys.jump){
    keys.jump = false;
    if (player.vy < -160 && !player.dying) player.vy *= 0.45; // variable jump height
  }
  else if (name === 'dash' && keys.dash){ keys.dash = false; releaseDash(); }
  else if (name) keys[name] = false;
  /* re-arm the F+G+H cheat when any of the three is released */
  if (k==='KeyF') cheatKeys.F = false;
  if (k==='KeyG') cheatKeys.G = false;
  if (k==='KeyH') cheatKeys.H = false;
  if (!cheatKeys.F || !cheatKeys.G || !cheatKeys.H) cheatLatched = false;
}
let dashEdge = false;
/* cheat code: F + G + H held together -> skip to the next zone (in the
   final zone: straight to CASH OUT). One fire per combo — releasing any
   key re-arms it. */
const cheatKeys = { F:false, G:false, H:false };
let cheatLatched = false;
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
window.addEventListener('blur', ()=>{ if (state==='play') state='paused'; });
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && state==='play') state='paused'; });

/* touch controls — auto on touch devices, or force with ?touch=1 (QA) */
const touchEl = document.getElementById('touch');
const IS_TOUCH = ('ontouchstart' in window)
  || (typeof location !== 'undefined' && new URLSearchParams(location.search).get('touch') === '1');
if (IS_TOUCH) touchEl.classList.add('on');
function bindTouch(id, down, up){
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', ev=>{ ev.preventDefault(); ensureAudio(); down(); });
  el.addEventListener('pointerup',   ev=>{ ev.preventDefault(); up(); });
  el.addEventListener('pointercancel', ev=>{ ev.preventDefault(); up(); });
}
bindTouch('tLeft', ()=>keys.left=true,  ()=>keys.left=false);
bindTouch('tRight',()=>keys.right=true, ()=>keys.right=false);
bindTouch('tJump', ()=>{ keys.jump=true; jumpBuf=JBUF; }, ()=>{ keys.jump=false; if(player.vy<-160&&!player.dying) player.vy*=0.45; });
bindTouch('tDash', ()=>{ dashEdge=true; keys.dash=true; }, ()=>{ keys.dash=false; releaseDash(); });
/* tap the play area: start from the title, restart after win/gameover
   (the 0.9 s guard stops an accidental tap from skipping the win screen) */
canvas.addEventListener('pointerdown', ev=>{
  ev.preventDefault(); ensureAudio();
  if (state === 'title') startRun();
  else if ((state === 'win' || state === 'gameover') && performance.now() - screenAt > 900) startRun();
});

/* ---------------- game state ---------------- */
applyStage(0);            // bind stage-1 globals before the player exists
let state = 'title';      // title | play | paused | stclear | dying | gameover | win
let screenAt = 0;         // when the win/gameover screen came up (tap-restart guard)
let time = 0, score = 0, lives = 3, winT = 0, dieT = 0, globalT = 0;
let stClearT = 0;         // zone-transition banner timer
let ringsTotal = 0;       // rings collected across the whole run
let best = parseFloat(localStorage.getItem('rb_run_best') || '0') || 0;
let bestBeaten = false;
let camX = 0, camY = 140, shakeT = 0, shakeMag = 0;
let flashMsgT = 0, flashMsg = '';
const particles = [];
const floaters = [];
const looseRings = [];
const clouds = CLOUDS;

const player = {
  x:START.x, y:START.y, vx:0, vy:0,
  face:1, ground:false, roll:false, charge:0,
  coyote:0, inv:0, dying:false, spinT:0, animT:0, squash:0, dropT:0,
  rings:0, respawn:{x:START.x,y:START.y},
};

function showFlash(m, t){ flashMsg = m; flashMsgT = t; }

function resetWorld(){
  time = 0; score = 0; lives = 3; winT = 0; dieT = 0;
  bestBeaten = false; ringsTotal = 0;
  particles.length = 0; floaters.length = 0; looseRings.length = 0;
  loadStage(0);
  player.dying = false; player.rings = 0; player.inv = 0;
  jumpBuf=0; keys.jump=false; keys.dash=false;
}
function startRun(){ resetWorld(); state='play'; startStageMusic(0); }

function addParticle(x,y,vx,vy,life,col,size,grav){
  particles.push({x,y,vx,vy,life,max:life,col,size:size||3,grav:grav||0});
}
function burst(x,y,n,col,speed){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = (0.4+Math.random()*0.6)*speed;
    addParticle(x,y,Math.cos(a)*s,Math.sin(a)*s-60,0.5+Math.random()*0.4,col,2+Math.random()*3,600);
  }
}
function addFloater(x,y,txt,col){ floaters.push({x,y,txt,col:col||'#fff',life:0.9}); }
function scatterRings(n){
  for (let i=0;i<n;i++){
    looseRings.push({
      x:player.x, y:player.y-16,
      vx:(Math.random()*2-1)*300,
      vy:-200-Math.random()*350,
      life:4, got:false,
    });
  }
}
function damage(){
  if (player.inv > 0 || player.dying) return;
  if (player.rings > 0){
    scatterRings(Math.min(player.rings, 9));
    player.rings = 0;
    player.inv = 2;
    player.vy = -360;
    player.vx = -player.face * 220;
    player.ground = false;
    player.roll = false;
    AudioSys.hurt();
    shakeT = 0.3; shakeMag = 5;
  } else {
    killPlayer();
  }
}
function killPlayer(){
  if (player.dying) return;
  player.dying = true;
  dieT = 0;
  player.vy = -560;
  player.vx = 0;
  player.ground = false;
  AudioSys.death();
  shakeT = 0.4; shakeMag = 8;
  state = 'dying';
}
function respawn(){
  lives--;
  if (lives <= 0){ state = 'gameover'; screenAt = performance.now(); return; }
  player.x = player.respawn.x; player.y = player.respawn.y - 2;
  player.vx = 0; player.vy = 0; player.roll = false; player.charge = 0;
  player.rings = 0; player.inv = 2.5; player.dying = false;
  state = 'play';
}

/* ---------------- dash ----------------
   Tap the dash key 3 times (charges stack across taps), then release
   to launch. A release with <3 charge keeps the charge so quick
   successive taps stack. */
function releaseDash(){
  const p = player;
  if (p.charge >= 3 && p.ground && !p.dying && state==='play'){
    p.vx = p.face * (DASH_BASE + p.charge * DASH_STEP);
    p.roll = true;
    p.charge = 0;
    AudioSys.dashLaunch();
    for (let i=0;i<8;i++)
      addParticle(p.x - p.face*14, p.y-4, -p.face*(120+Math.random()*160), (Math.random()-0.5)*80, 0.35, '#cfe8ff', 2.5);
  }
  // charge < 3: keep it — the player is still tapping
}

/* ---------------- enemy helpers ---------------- */
function enemyRadius(e){
  const t = e.type;
  if (t==='fee') return 13;
  if (t==='stop') return 15;
  if (t==='lag') return 13;
  if (t==='slip') return 15;
  if (t==='spam') return 12;
  if (t==='wick') return 14;
  if (t==='pump') return 16;
  if (t==='drop') return 13;
  if (t==='crab') return 13;
  if (t==='roll') return 13;
  if (t==='spik') return 13;
  if (t==='hide') return 13;
  if (t==='jaws') return 14;
  if (t==='unid') return 15;
  if (t==='garg') return 14;
  if (t==='unic') return 12;
  if (t==='bomb') return 14;
  if (t==='tire') return 14;
  if (t==='dron') return 13;
  if (t==='cate') return 13;
  if (t==='hogg') return 14;
  return 16; // rug
}
function enemyName(e){ return e.type.toUpperCase(); }

/* ---------------- fixed-step update ---------------- */
function step(dt){
  globalT += dt;
  if (state==='play' || state==='stclear') time += dt;
  if (flashMsgT > 0) flashMsgT -= dt;
  if (shakeT > 0) shakeT -= dt;
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt; p.vy += p.grav*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.life<=0) particles.splice(i,1);
  }
  for (let i=floaters.length-1;i>=0;i--){
    const f = floaters[i];
    f.life -= dt; f.y -= 34*dt;
    if (f.life<=0) floaters.splice(i,1);
  }
  if (state==='win') winT += dt;
  /* zone transition: banner plays, timer keeps running, then load zone 2 */
  if (state==='stclear'){
    stClearT += dt;
    updateCam(dt);
    if (stClearT >= 2.4){
      const next = stage + 1;
      loadStage(next);
      startStageMusic(next);
      state = 'play';
    }
    return;
  }
  if (state!=='play' && state!=='dying'){
    // enemies still animate on title screens
    for (const e of ENEMIES) if (!e.dead) e.t += dt;
    return;
  }
  const p = player;

  /* ----- enemies ----- */
  for (const e of ENEMIES){
    if (e.dead) continue;
    e.t += dt;
    if (e.type==='fee'){
      e.hop = Math.abs(Math.sin(e.t*2.2)) * -20;
      e.y = e.base + e.hop;
    } else if (e.type==='spam'){
      /* spam bot: fast little hoppers */
      e.hop = Math.abs(Math.sin(e.t*3.4)) * -26;
      e.y = e.base + e.hop;
    } else if (e.type==='lag' || e.type==='stop' || e.type==='rug' || e.type==='wick'){
      const spd = e.type==='lag' ? 34 : e.type==='stop' ? 74 : e.type==='rug' ? 58 : 190;
      e.x += e.dir * spd * dt;
      if (e.x < e.a){ e.x = e.a; e.dir = 1; }
      if (e.x > e.b){ e.x = e.b; e.dir = -1; }
      e.y = e.base;
    } else if (e.type==='slip' || e.type==='pump'){
      const amp = e.type==='slip' ? 30 : 25;
      const fr = e.type==='slip' ? 1.5 : 1.8;
      e.y = e.y0 + Math.sin(e.t*fr)*amp;
    } else if (e.type==='drop'){
      /* DROP: Buzz-Bomber-style flyer, drifts in a lazy figure-eight */
      e.bx = e.bx !== undefined ? e.bx : e.x;
      e.by = e.by !== undefined ? e.by : e.base;
      e.x = e.bx + Math.sin(e.t*0.9) * 55;
      e.y = e.by + Math.sin(e.t*1.7) * 22;
    } else if (e.type==='crab'){
      /* CRAB: Crabmeat-style walker — crawls slow, scuttles fast when
         you're close (claws raise) */
      const near = Math.abs(player.x - e.x) < 110 && Math.abs(player.y - e.y) < 80;
      e.hot = near;
      const spd = near ? 130 : 48;
      e.x += e.dir * spd * dt;
      if (e.x < e.a){ e.x = e.a; e.dir = 1; }
      if (e.x > e.b){ e.x = e.b; e.dir = -1; }
      e.y = e.base;
    } else if (e.type==='roll'){
      /* ROLL: the Roller — a ball that rolls its lane and flips at the ends */
      e.x += e.dir * 92 * dt;
      if (e.x < e.a){ e.x = e.a; e.dir = 1; }
      if (e.x > e.b){ e.x = e.b; e.dir = -1; }
      e.spin = (e.spin || 0) + e.dir * dt * 7;
      e.y = e.base;
    } else if (e.type==='spik'){
      /* SPIK: spiky crawler (the original Spikes) — slow, spines pulsing */
      e.x += e.dir * 34 * dt;
      if (e.x < e.a){ e.x = e.a; e.dir = 1; }
      if (e.x > e.b){ e.x = e.b; e.dir = -1; }
      e.y = e.base;
    } else if (e.type==='hide'){
      /* HIDE (the Burrobot): lurks buried in its mound, then LEAPS when you
         approach — a burst of rubble, then a short hop away */
      e.vy = (e.vy || 0) + GRAV*1.5*dt;
      e.y += e.vy*dt;
      if (e.y > e.base){ e.y = e.base; e.vy = 0; }
      if (e.vy === 0 && Math.abs(p.x - e.x) < 130 && Math.abs(p.y - e.y) < 90){
        e.vy = -430;
        burst(e.x, e.y - 4, 7, '#8a7a50', 130);
        AudioSys.land();
      }
    } else if (e.type==='jaws'){
      /* JAWS: spiky ball patrolling the water surface */
      e.x += e.dir * 62 * dt;
      if (e.x < e.a){ e.x = e.a; e.dir = 1; }
      if (e.x > e.b){ e.x = e.b; e.dir = -1; }
      e.y = e.y0 + Math.sin(e.t*2.4) * 6;
    } else if (e.type==='unid'){
      /* UNID (Unidus): heavy green turtle, slow and steady */
      e.x += e.dir * 26 * dt;
      if (e.x < e.a){ e.x = e.a; e.dir = 1; }
      if (e.x > e.b){ e.x = e.b; e.dir = -1; }
      e.y = e.base;
    } else if (e.type==='garg'){
      /* GARG (gargoyle): stone head on a plinth — sits still and spits
         fireballs (the shot logic lives in the hazard section below) */
      e.y = e.base;
    } else if (e.type==='unic'){
      /* UNIC (Uni Uni): little blue turtle — a slow patroller that hops
         lazily as it goes (the original Star Light hopped) */
      e.hop = Math.abs(Math.sin(e.t*2.6)) * -16;
      e.x += e.dir * 26 * dt;
      if (e.x < e.a){ e.x = e.a; e.dir = 1; }
      if (e.x > e.b){ e.x = e.b; e.dir = -1; }
      e.y = e.base + e.hop;
    } else if (e.type==='bomb'){
      /* BOMB (Bomb): spiky mine sitting still — blinks red fast when you
         get close, pops if you step on it */
      e.y = e.base;
      e.hot = Math.abs(p.x - e.x) < 95 && Math.abs(p.y - e.y) < 70;
    } else if (e.type==='tire'){
      /* TIRE: spiky construction tire rolling its lane */
      e.x += e.dir * 88 * dt;
      if (e.x < e.a){ e.x = e.a; e.dir = 1; }
      if (e.x > e.b){ e.x = e.b; e.dir = -1; }
      e.spin = (e.spin || 0) + e.dir * dt * 8;
      e.y = e.base;
    } else if (e.type==='dron'){
      /* DRON: little propeller drone hovering over the lane */
      e.x += e.dir * 40 * dt;
      if (e.x < e.a){ e.x = e.a; e.dir = 1; }
      if (e.x > e.b){ e.x = e.b; e.dir = -1; }
      e.y = e.y0 + Math.sin(e.t*1.8) * 16;
    } else if (e.type==='cate'){
      /* CATE (Caterkiller): spiky segmented crawler — inches along with a
         wiggling gait, turns around at the ends of its lane */
      e.x += e.dir * 36 * dt;
      if (e.x < e.a){ e.x = e.a; e.dir = 1; }
      if (e.x > e.b){ e.x = e.b; e.dir = -1; }
      e.y = e.base;
    } else if (e.type==='hogg'){
      /* HOGG (Ball Hog): spiky red ball — patrols lazily, then CHARGES at
         full tilt the moment you get close (spikes whirl) */
      const near = Math.abs(p.x - e.x) < 120 && Math.abs(p.y - e.y) < 80;
      e.hot = near;
      const spd = near ? 155 : 30;
      if (near) e.dir = p.x > e.x ? 1 : -1;
      e.x += e.dir * spd * dt;
      if (e.x < e.a){ e.x = e.a; e.dir = 1; }
      if (e.x > e.b){ e.x = e.b; e.dir = -1; }
      e.spin = (e.spin || 0) + e.dir * (near ? 16 : 3) * dt;
      e.y = e.base;
    }
  }
  SPRINGS.forEach(s=>{ if (s.t>0) s.t -= dt; });
  BUMPERS.forEach(b=>{ if (b.t>0) b.t -= dt; });

  if (state==='dying'){
    dieT += dt;
    p.vy += GRAV*dt; p.y += p.vy*dt;
    p.spinT += dt*20;
    if (dieT > 1.05) respawn();
    updateCam(dt);
    return;
  }

  /* ----- input / horizontal ----- */
  const dir = (keys.right?1:0) - (keys.left?1:0);
  if (dashEdge){
    dashEdge = false;
    if (p.ground && Math.abs(p.vx) < 80 && p.charge < 3 && !p.dying){
      p.charge++;
      AudioSys.dashTick(p.charge);
      for (let i=0;i<4;i++)
        addParticle(p.x - p.face*(14+p.charge*4), p.y-4, -p.face*(60+Math.random()*60), -20-Math.random()*40, 0.3, '#cfe8ff', 2.5);
    }
  }
  /* cancel a charge if the conditions are no longer met */
  if (p.charge > 0 && (!p.ground || Math.abs(p.vx) > 80)) p.charge = 0;
  if (dir !== 0){
    p.face = dir;
    if (p.roll){
      // opposite input cancels the roll
      if (dir * Math.sign(p.vx) < 0 && Math.abs(p.vx) > 60){
        p.roll = false;
        p.vx = dir * 40;
      }
    }
    if (!p.roll || p.ground===false){
      // cap is computed from the PRE-increment speed: in the air this keeps
      // the current speed (spin-dash momentum) without letting air input
      // accelerate the player without bound
      const cap = p.ground ? RUN_MAX : Math.max(RUN_MAX, Math.abs(p.vx));
      p.vx += dir * (p.ground ? RUN_ACC : AIR_ACC) * dt;
      if (p.vx > cap) p.vx = Math.max(cap, p.vx - 2000*dt);
      if (p.vx < -cap) p.vx = Math.min(-cap, p.vx + 2000*dt);
    }
  } else if (p.roll){
    p.vx -= Math.sign(p.vx) * ROLL_FR * dt * Math.min(60,Math.abs(p.vx));
    if (Math.abs(p.vx) < 5) p.roll = false; // don't get stuck in a zero-speed roll
  } else {
    const fr = (p.ground ? FRICTION : 400) * dt;
    if (p.vx > 0) p.vx = Math.max(0, p.vx - fr);
    else if (p.vx < 0) p.vx = Math.min(0, p.vx + fr);
  }
  p.vx = Math.max(-1100, Math.min(1100, p.vx));

  /* ----- jump ----- */
  if (jumpBuf > 0) jumpBuf -= dt;
  if (p.ground) p.coyote = COYOTE; else p.coyote -= dt;
  if (jumpBuf > 0 && p.coyote > 0){
    p.vy = -JUMP_V;
    p.ground = false;
    p.coyote = 0; jumpBuf = 0;
    AudioSys.jump();
    for (let i=0;i<5;i++)
      addParticle(p.x+(Math.random()*16-8), p.y, (Math.random()-0.5)*60, -30-Math.random()*50, 0.3, '#e8f4ff', 2.5);
  }

  /* ----- gravity ----- */
  p.vy += GRAV*dt;
  if (p.vy > MAXFALL) p.vy = MAXFALL;
  const prevY = p.y;
  p.x += p.vx*dt;
  p.y += p.vy*dt;
  if (p.x < 24){ p.x = 24; p.vx = 0; }
  if (p.x > WORLD_W-16){ p.x = WORLD_W-16; p.vx = 0; }

  /* ----- ground collision ----- */
  const wasGround = p.ground;
  p.ground = false;
  const h = groundHeight(p.x);
  if (h !== null && p.vy >= 0 && p.y >= h && prevY <= h + 14){
    p.y = h;
    if (!wasGround && p.vy > 700){
      p.squash = 0.16;
      AudioSys.land();
      for (let i=0;i<6;i++)
        addParticle(p.x+(Math.random()*20-10), p.y, (Math.random()-0.5)*120, -20-Math.random()*40, 0.35, '#d8e6d8', 2.5);
    }
    p.vy = 0;
    p.ground = true;
    if (p.roll && !wasGround) p.roll = false; // spin-dash ends on landing
  }
  /* platforms (one-way; dropping platforms skip while down) */
  if (p.dropT > 0) p.dropT -= dt;
  if (!p.ground && p.vy >= 0 && p.dropT <= 0){
    for (const pl of PLATFORMS){
      if (platDown(pl)) continue;
      if (p.x > pl.x-6 && p.x < pl.x+pl.w+6){
        const top = pl.y;
        if (p.y >= top && prevY <= top + 14){
          p.y = top; p.vy = 0; p.ground = true;
          if (!wasGround) p.roll = false;
          break;
        }
      }
    }
  }
  /* drop through platform (hold down) */
  if (keys.down && p.ground && p.dropT <= 0){
    let onPlat = false;
    for (const pl of PLATFORMS){
      if (platDown(pl)) continue;
      if (p.x > pl.x-6 && p.x < pl.x+pl.w+6 && Math.abs(p.y - pl.y) < 4){ onPlat = true; break; }
    }
    if (onPlat){ p.dropT = 0.25; p.y += 2; p.ground = false; p.vy = 60; }
  }
  if (p.squash > 0) p.squash -= dt;
  p.animT += dt * (Math.abs(p.vx) > 40 ? 1 : 0.25);
  p.spinT += dt * (Math.abs(p.vx) > 300 || !p.ground ? 14 : 4);
  if (p.inv > 0) p.inv -= dt;

  /* running dust */
  if (p.ground && Math.abs(p.vx) > 240 && Math.random() < dt*22){
    addParticle(p.x - p.face*10, p.y-2, -p.face*60, -20, 0.3, 'rgba(255,255,255,0.7)', 2.5);
  }
  /* speed lines */
  if (Math.abs(p.vx) > 720 && Math.random() < dt*30){
    addParticle(p.x - p.face*26, p.y-6-Math.random()*24, -p.face*40, 0, 0.2, 'rgba(255,255,255,0.5)', 1.5);
  }

  /* ----- springs (red mega springs launch far higher) ----- */
  for (const s of SPRINGS){
    if (Math.abs(p.x - s.x) < 16 && Math.abs(p.y - s.y) < 22 && p.vy >= -100){
      p.vy = s.mega ? -1560 : -SPRING_V;
      p.ground = false;
      s.t = 0.3;
      AudioSys.spring();
      burst(s.x, s.y-6, s.mega ? 14 : 8, s.mega ? '#ff5a4e' : '#ffe23e', s.mega ? 240 : 160);
    }
  }

  /* ----- pinball bumpers: bounce up + 50 points ----- */
  for (const b of BUMPERS){
    if (b.cd > 0) b.cd -= dt;
    if (b.t > 0) b.t -= dt;
    if (b.cd > 0 || p.dying) continue;
    const dx = p.x - b.x, dy = (p.y - 12) - (b.y - 6);
    const rr = b.r + 12;
    if (dx*dx + dy*dy < rr*rr){
      b.cd = 0.45; b.t = 0.5;
      p.vy = -820; p.ground = false;
      p.score += 50; score += 50;
      AudioSys.bump();
      burst(b.x, b.y - 10, 8, BUMPCOL[b.ph % 4], 160);
      addFloater(b.x, b.y - 26, '+50', '#ffe23e');
    }
  }

  /* ----- iron balls: they shove you (no damage) ----- */
  for (const o of ORBS){
    if (o.cd > 0) o.cd -= dt;
    o.x = o.cx + Math.sin(globalT*o.sp + o.ph) * o.ax;
    o.y = o.cy + Math.sin(globalT*o.sp*0.8 + o.ph) * o.ay;
    if (o.cd > 0 || p.dying) continue;
    const dx = p.x - o.x, dy = (p.y - 12) - o.y;
    const rr = o.r + 12;
    if (dx*dx + dy*dy < rr*rr){
      o.cd = 0.35;
      const d = Math.hypot(dx, dy) || 1;
      p.vx += (dx/d) * 150;
      p.vy += (dy/d) * 150 - 50;
      AudioSys.bump();
      burst(o.x, o.y - 6, 5, '#d8e8ff', 90);
    }
  }

  /* ----- star light traps (zone 5): construction fans + seesaws ----- */
  for (const f of FANS){
    if (f.cd > 0) f.cd -= dt;
    if (f.t > 0) f.t -= dt;
    const on = Math.sin(globalT*f.sp + f.ph) > 0.7; /* brief blast windows */
    if (f.cd <= 0 && !p.dying && on &&
        Math.abs(p.x - f.x) < f.r + 12 && Math.abs((p.y - 14) - (f.y - 34)) < f.r + 10){
      f.cd = 0.55; f.t = 0.3;
      p.vx = -Math.max(180, Math.abs(p.vx) * 0.6);
      AudioSys.bump();
      for (let i=0;i<5;i++)
        addParticle(f.x - 16 - Math.random()*34, f.y - 34 + (Math.random()*44 - 22),
                    -170 - Math.random()*90, 0, 0.35, 'rgba(190,220,255,0.8)', 2.5);
    }
  }
  for (const s of SEEWAS){
    if (s.t > 0) s.t -= dt;
    if (p.dying) continue;
    if (Math.abs(p.x - s.x) < 34 && Math.abs(p.y - s.y) < 16 && p.vy >= -50){
      s.t = 0.5;
      p.vy = -760; p.ground = false;
      AudioSys.spring();
      burst(s.x, s.y - 8, 6, '#ffd23e', 150);
    }
  }

  /* ----- scrap brain traps (zone 6): flame jets + conveyor belts -----
     jets: ground nozzles that spit a straight jet of fire in short
     timed windows (lethal while active). belts: while you're grounded on
     one it carries you — some forward, some backwards. */
  for (const j of FJETS){
    if (j.cd > 0) j.cd -= dt;
    const on = Math.sin(globalT*j.sp + j.ph) > 0.7;
    if (!on) continue;
    if (p.dying) continue;
    if (j.cd <= 0 && Math.abs(p.x - j.x) < 24 && p.y > j.y - 92 && p.y < j.y + 10){
      j.cd = 1;
      damage(); /* hurt/death SFX come from damage() itself */
      burst(j.x, j.y - 46, 10, '#ff8a3e', 170);
      break;
    }
  }
  for (const b of BELTS){
    const g = groundHeight(p.x);
    if (p.ground && g !== null && p.x > b.x0 && p.x < b.x1){
      p.x += b.spd * dt;
    }
  }

  /* ----- labyrinth traps (zone 4): sliding walls, spikes, pendulums ----- */
  for (const w of WALLS){
    const bot = (w.y0+w.y1)/2 + ((w.y1-w.y0)/2) * Math.sin(globalT*w.sp + w.ph);
    const top = bot - w.h;
    if (p.dying) break;
    if (p.x + 10 > w.x && p.x - 10 < w.x + w.w && p.y > top && p.y - 24 < bot){
      /* the slab shoves you back — it never hurts */
      const left = p.x < w.x + w.w/2;
      p.x = left ? w.x - 11 : w.x + w.w + 11;
      p.vx = 0;
    }
  }
  for (const s of SPIKES){
    if (p.dying) break;
    const act = Math.sin(globalT*s.sp + s.ph) > 0.866;
    if (!act) continue;
    if (p.x > s.x0 - 8 && p.x < s.x1 + 8 && p.y > s.y - 20 && p.y < s.y + 8) damage();
  }
  for (const q of PENDS){
    if (p.dying) break;
    const ang = q.amp * Math.sin(globalT*q.sp + q.ph);
    const bx = q.ax + Math.sin(ang) * q.len;
    const by = q.ay + Math.cos(ang) * q.len;
    const dx = p.x - bx, dy = (p.y - 14) - by;
    const rr = q.r + 12;
    if (dx*dx + dy*dy < rr*rr) damage();
  }

  /* ----- gargoyle fireballs ----- */
  for (const e of ENEMIES){
    if (e.dead || e.type !== 'garg') continue;
    e.cd = (e.cd || 0) - dt;
    if (e.cd <= 0 && !p.dying){
      const dx = p.x - e.x;
      if (Math.abs(dx) < 260 && Math.abs(p.y - e.y) < 130){
        e.cd = 2.4;
        const dir = Math.sign(dx) || 1;
        PROJECTILES.push({ x: e.x + dir*16, y: e.y - 18, vx: dir*115, vy: 0, life: 2.6 });
        burst(e.x + dir*16, e.y - 18, 5, '#ff8a2e', 110);
        AudioSys.bump();
      }
    }
  }
  for (let i = PROJECTILES.length - 1; i >= 0; i--){
    const f = PROJECTILES[i];
    f.life -= dt;
    f.x += f.vx*dt;
    if (f.life <= 0){ PROJECTILES.splice(i, 1); continue; }
    /* a rolling spin can smash a fireball for +50 */
    if (p.roll && Math.abs(p.vx) > 120){
      const dx = p.x - f.x, dy = (p.y - 14) - f.y;
      if (dx*dx + dy*dy < 26*26){
        PROJECTILES.splice(i, 1);
        p.score += 50; score += 50;
        AudioSys.stomp();
        burst(f.x, f.y, 8, '#ff8a2e', 160);
        addFloater(f.x, f.y - 12, '+50', '#ffe23e');
        continue;
      }
    }
    if (p.dying) continue;
    const dx = p.x - f.x, dy = (p.y - 14) - f.y;
    if (dx*dx + dy*dy < 20*20){
      PROJECTILES.splice(i, 1);
      burst(f.x, f.y, 8, '#ff8a2e', 150);
      damage();
    }
  }

  /* ----- rings ----- */
  const collect = (r, silent)=>{
    if (r.got) return;
    r.got = true;
    p.rings++; ringsTotal++; score += 10;
    if (!silent){
      ringCombo++; ringComboT = 0.8;
      AudioSys.ring(ringCombo);
      burst(r.x, r.y, 6, '#54e07a', 140);
      addFloater(r.x, r.y-14, '+10', '#7dff9a');
    }
  };
  for (const r of RINGS){
    if (r.got) continue;
    const dx = p.x - r.x, dy = (p.y-15) - r.y;
    if (dx*dx + dy*dy < 26*26) collect(r);
  }
  for (let i=looseRings.length-1;i>=0;i--){
    const r = looseRings[i];
    r.life -= dt;
    r.vy += GRAV*0.9*dt;
    r.x += r.vx*dt; r.y += r.vy*dt;
    r.vx *= (1 - 1.6*dt);
    const g = groundHeight(r.x);
    if (g !== null && r.y > g){ r.y = g; r.vy *= -0.45; r.vx *= 0.7; }
    for (const pl of PLATFORMS){
      if (platDown(pl)) continue;
      if (r.x > pl.x && r.x < pl.x+pl.w && r.y > pl.y && r.y < pl.y+10 && r.vy>0){ r.y=pl.y; r.vy*=-0.45; }
    }
    if (r.life<=0){ looseRings.splice(i,1); continue; }
    const dx = p.x - r.x, dy = (p.y-15) - r.y;
    if (dx*dx + dy*dy < 24*24){ looseRings.splice(i,1); collect(r); }
  }
  if (ringComboT > 0){ ringComboT -= dt; if (ringComboT<=0) ringCombo = 0; }

  /* ----- enemies (popped BLOW bots are harmless) ----- */
  for (const e of ENEMIES){
    if (e.dead || e.popped) continue;
    const er = enemyRadius(e);
    const dx = p.x - e.x, dy = (p.y-14) - (e.y - er*0.7);
    const rr = er + PLAYER_R - 4;
    const d2 = dx*dx + dy*dy;
    if (!Number.isFinite(d2) || d2 > rr*rr) continue;
    const canSmash = (p.roll && Math.abs(p.vx) > 120) || (!p.ground && p.vy > 0);
    if (canSmash){
      e.dead = true;
      p.score += 100; score += 100;
      AudioSys.stomp();
      burst(e.x, e.y-er, 12, e.type==='fee' ? '#b06ad4' : '#ff6a5e', 200);
      addFloater(e.x, e.y-er-10, '+100', '#ffe23e');
      if (p.ground && p.roll) p.vy = -280, p.ground = false;
      shakeT = 0.15; shakeMag = 3;
    } else {
      damage();
    }
  }

  /* ----- checkpoints ----- */
  for (const c of CHECKPOINTS){
    if (!c.on && Math.abs(p.x - c.x) < 22){
      c.on = true;
      p.respawn = {x:c.x, y:c.y - 2};
      AudioSys.checkpoint();
      showFlash('CHECKPOINT', 1.4);
      burst(c.x, c.y-56, 14, '#54e07a', 180);
    }
  }

  /* ----- FINAL ZONE (zone 7): the Egg Crusher boss arena -----
     Robotnik rides his floor pistons; stomp his head 8 times to win.
     Ceiling crusher pistons slam down in telegraphed windows, and
     columns of energy orbs drop from the ceiling after each hit. */
  if (stage === 6 && BOSS){
    const b = BOSS;
    /* the door closes behind you — no going back left */
    if (!doorClosed && p.x > 400) doorClosed = true;
    if (doorClosed && p.x < 376){ p.x = 376; if (p.vx < 0) p.vx = 0; }
    doorT = Math.min(1, doorT + dt*2);
    /* the room's ceiling */
    if (CEIL && p.x > CEIL.x0 && p.x < CEIL.x1 && p.y - 12 < CEIL.y && p.vy < 0){
      p.y = CEIL.y + 12; p.vy = 90;
    }
    /* ceiling crusher pistons: brief, telegraphed slams */
    for (const c of CPISTS){
      const sv = Math.sin(globalT*c.sp + c.ph);
      c.warn = sv > 0.25 && sv <= 0.7;
      c.ext = sv > 0.7;
      if (c.ext && !b.dead && !p.dying && p.inv <= 0 &&
          Math.abs(p.x - c.x) < 34 && p.y > 330){
        damage();
        p.x += (p.x < c.x ? -1 : 1) * 70;
        p.vy = -240;
      }
    }
    if (!b.dead){
      b.inv = Math.max(0, b.inv - dt);
      b.fade = Math.max(0, b.fade - dt);
      /* Robotnik swaps between his two floor pistons: the machine shifts
         him to the other piston shortly after each hit (as in the
         original), plus a slower idle shuffle to keep him from camping */
      const doSwap = () => {
        b.slot = 1 - (b.slot || 0);
        b.x = b.slots[b.slot];
        b.fade = 0.4;
        burst(b.x, b.y - 30, 10, '#c060ff', 160);
        AudioSys.bump();
      };
      b.swapT -= dt;
      if (b.swapT <= 0){ doSwap(); b.swapT = 8; }
      if (b.teleT > 0){
        b.teleT -= dt;
        if (b.teleT <= 0) doSwap();
      }
      /* periodic orb columns, offset from his slot */
      b.orbT -= dt;
      if (b.orbT <= 0){
        spawnOrbColumn(b.x);
        b.orbT = 7;
      }
      /* stomp his head, or bump his body */
      const headY = b.y - 44;
      if (!p.dying && b.inv <= 0 && p.vy > 80 &&
          Math.abs(p.x - b.x) < 28 && p.y > headY - 20 && p.y < headY + 30){
        b.hp--; b.inv = 1.4; p.vy = -520; b.teleT = 0.6;
        /* bounce out to the side you came from (never back into his body) */
        p.x += (p.x < b.x ? -1 : 1) * 55;
        p.inv = Math.max(p.inv, 0.8); /* brief mercy: the bounce back out is safe */
        score += 100;
        shakeT = 0.25; shakeMag = 5;
        burst(b.x, headY, 16, '#ffd23e', 220);
        addFloater(b.x, headY - 20, '+100', '#ffe23e');
        AudioSys.stomp();
        if (b.hp <= 0){
          /* CASH OUT: the machine explodes, Robotnik flees */
          b.dead = true; b.dieT = 0;
          score += 1000;
          for (let i = 0; i < 3; i++)
            burst(b.x + (i - 1) * 40, b.y - 30, 26, i % 2 ? '#ff8a3e' : '#ffd23e', 260);
          AudioSys.stageClear();
        } else {
          orbQueue = 2; orbQT = 0.5; /* hit response: orbs come for you */
        }
      } else if (!p.dying && p.inv <= 0 && b.inv <= 0 &&
          /* body contact only from the side/below — diving from above is
             stomp territory, and a freshly-hit boss is out of reach */
          Math.abs(p.x - b.x) < 22 &&
          (p.y - 14) > (b.y - 44) && Math.abs((p.y - 14) - (b.y - 24)) < 28){
        damage();
        p.vx = (p.x < b.x ? -1 : 1) * 260;
        p.vy = -280;
      }
    } else {
      /* death sequence: explosions + escape, then CASH OUT */
      b.dieT += dt;
      if (b.dieT > 2.4) advanceStage();
    }
    /* orb column queue (fired after a hit) */
    if (orbQueue > 0){
      orbQT -= dt;
      if (orbQT <= 0){
        spawnOrbColumn(b.x);
        orbQueue--; orbQT = 0.5;
      }
    }
    /* energy orbs falling from the ceiling */
    for (let i = BOSS_ORBS.length - 1; i >= 0; i--){
      const o = BOSS_ORBS[i];
      o.y += 480 * dt;
      if (o.y > 515){ BOSS_ORBS.splice(i, 1); continue; }
      if (!p.dying && p.inv <= 0 &&
          Math.abs(p.x - o.x) < 24 && Math.abs((p.y - 14) - o.y) < 24){
        BOSS_ORBS.splice(i, 1);
        damage();
        p.vy = -240;
      }
    }
  }

  /* ----- pit / fall ----- */
  if (p.y > PIT_KILL){ killPlayer(); return; }

  /* ----- goal (or the F+G+H cheat) ----- */
  if (p.x >= GOAL_X && state==='play') advanceStage();

  updateCam(dt);
}

let ringCombo = 0, ringComboT = 0;

function updateCam(dt){
  const lead = Math.max(-90, Math.min(150, player.vx * 0.28));
  const tx = player.x + lead - VIEW_W*0.42;
  camX += (Math.max(0, Math.min(WORLD_W - VIEW_W + 60, tx)) - camX) * Math.min(1, dt*6);
  const ty = Math.max(0, Math.min(140, (player.y-15) - 300));
  camY += (ty - camY) * Math.min(1, dt*4);
}

/* ============================================================
   RENDERING
   ============================================================ */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const sx = (shakeT>0 ? (Math.random()*2-1)*shakeMag*shakeT*3 : 0);
  const sy = (shakeT>0 ? (Math.random()*2-1)*shakeMag*shakeT*3 : 0);
  const cx = camX + sx, cy = camY + sy;

  /* per-zone background */
  drawBackground(cx, cy);

  /* ---------- world space ---------- */
  ctx.save();
  ctx.translate(-Math.round(cx), -Math.round(cy));

  drawTerrain(cx, cy);
  if (stage === 1 || stage === 3) for (const pit of PITS) drawWater(pit);
  drawDecor(cx);
  if (stage === 1 || stage === 3) drawCeiling(cx);
  drawGoal();
  for (const c of CHECKPOINTS) drawCheckpoint(c);
  for (const s of SPRINGS) drawSpring(s);
  if (stage === 2){
    drawBumpers();
    drawOrbs();
  }
  if (stage === 3){
    drawWalls();
    drawSpikes();
    drawPends();
    for (const f of PROJECTILES) drawFireball(f);
  }
  if (stage === 4){
    for (const pit of PITS) drawPitMarker(pit);
    for (const f of FANS) drawFan(f);
    for (const s of SEEWAS) drawSeesaw(s);
  }
  if (stage === 5){
    for (const j of FJETS) drawJet(j);
  }
  if (stage === 6){
    drawFinalDoor();
    drawFinalCeiling();
    for (const c of CPISTS) drawCeilingPiston(c);
  }
  for (const pl of PLATFORMS) drawPlatform(pl);

  /* rings */
  for (const r of RINGS) if (!r.got) drawRing(r.x, r.y, r.x*0.6);
  for (const r of looseRings){
    if (r.life < 1.4 && Math.sin(globalT*24) > 0) continue;
    drawRing(r.x, r.y, r.x*0.6);
  }
  /* enemies */
  for (const e of ENEMIES) if (!e.dead) drawEnemy(e);
  /* zone 7: energy orbs + Robotnik (he stands on his slot cap) */
  if (stage === 6 && BOSS){
    for (const o of BOSS_ORBS) drawBossOrb(o);
    drawBoss(BOSS);
  }
  /* player */
  drawPlayer();

  /* particles */
  for (const p of particles){
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  /* floaters */
  ctx.font = 'bold 13px Consolas, monospace';
  ctx.textAlign = 'center';
  for (const f of floaters){
    ctx.globalAlpha = Math.min(1, f.life*2);
    ctx.fillStyle = f.col;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  /* ---------- screen space ---------- */
  drawHUD();
  if (state==='title') drawTitle();
  if (state==='stclear') drawStageClear();
  if (state==='paused') drawCenterPanel('PAUSED', [
    'ESC / P — resume',
    'R — restart', 'M — mute',
  ]);
  if (state==='gameover') drawGameOver();
  if (state==='win') drawWin();
  if (flashMsgT > 0){
    ctx.globalAlpha = Math.min(1, flashMsgT*2);
    ctx.font = 'bold 22px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 4;
    const msg = (flashMsg==='MUTED') ? 'SOUND OFF' : flashMsg;
    ctx.strokeText(msg, VIEW_W/2, VIEW_H*0.3);
    ctx.fillText(msg, VIEW_W/2, VIEW_H*0.3);
    ctx.globalAlpha = 1;
  }
  /* crash banner: if a frame threw, the loop survives and shows this;
     R restarts the run. (See the try/catch in frame() below.) */
  if (loopErrT > 0){
    ctx.fillStyle = 'rgba(120,20,20,0.85)';
    roundRect(VIEW_W/2 - 190, VIEW_H - 44, 380, 30, 6); ctx.fill();
    ctx.font = 'bold 14px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd8d0';
    ctx.fillText('RUN BROKE — PRESS R TO RESTART', VIEW_W/2, VIEW_H - 24);
  }
}

/* ---------- world-space drawing ---------- */
function drawBackground(cx, cy){
  const g = ctx.createLinearGradient(0,0,0,VIEW_H);
  if (stage === 0){
    g.addColorStop(0,'#5fb8ff');
    g.addColorStop(0.55,'#9fd4ff');
    g.addColorStop(1,'#e8f6ff');
  } else if (stage === 1){
    g.addColorStop(0,'#04060f');
    g.addColorStop(0.5,'#0d1230');
    g.addColorStop(1,'#232352');
  } else if (stage === 4){
    /* star light: deep night over the construction site */
    g.addColorStop(0,'#05071a');
    g.addColorStop(0.5,'#0c1330');
    g.addColorStop(1,'#1b2350');
  } else if (stage === 5){
    /* scrap brain: polluted smog over the industrial base — a sickly
       orange haze at the horizon fading up into dark smoke-grey sky */
    g.addColorStop(0,'#101418');
    g.addColorStop(0.45,'#1a2027');
    g.addColorStop(0.75,'#2c2a26');
    g.addColorStop(1,'#4a3a26');
  } else if (stage === 6){
    /* final zone: the dark green laboratory at the heart of Scrap Brain */
    g.addColorStop(0,'#0a120c');
    g.addColorStop(0.5,'#14241a');
    g.addColorStop(1,'#0d1a12');
  } else {
    /* spring yard: dusk over the pinball city */
    g.addColorStop(0,'#171030');
    g.addColorStop(0.5,'#2c1f4e');
    g.addColorStop(0.8,'#4a3568');
    g.addColorStop(1,'#5a4070');
  }
  ctx.fillStyle = g;
  ctx.fillRect(0,0,VIEW_W,VIEW_H);
  if (stage === 2){
    /* pale moon over the dusk city */
    const mx = 1030 - cx*0.05, my = 100 - cy*0.1;
    ctx.fillStyle = 'rgba(250,240,200,0.9)';
    ctx.beginPath(); ctx.arc(mx, my, 32, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(250,240,200,0.14)';
    ctx.beginPath(); ctx.arc(mx, my, 50, 0, Math.PI*2); ctx.fill();
    /* far purple mountains */
    ctx.fillStyle = '#3a2c5c';
    for (let i = -1; i < 9; i++){
      const hx = i*300 - (cx*0.12 % 300);
      const hy = 356 - cy*0.2;
      const hsh = ((i*7919+11)>>>0) % 17;
      ctx.beginPath();
      ctx.moveTo(hx-160, hy+44);
      ctx.lineTo(hx-40, hy-56-(hsh*4));
      ctx.lineTo(hx+30, hy-16);
      ctx.lineTo(hx+110, hy-84-((hsh>>2)*6));
      ctx.lineTo(hx+190, hy+44);
      ctx.closePath(); ctx.fill();
    }
    /* city skyline: two parallax rows of dark towers with lit windows */
    for (let row = 0; row < 2; row++){
      const par = row ? 0.2 : 0.14;
      for (let i = -1; i < 5; i++){
        const bx = i*230 - ((cx*par) % 230) - (row ? 60 : 0);
        const hsh = (((i+40)*104729 + row*31)>>>0) % 997;
        const bw = 62 + (hsh % 40);
        const bh = 90 + (hsh % 130);
        const by = 436 - cy*0.25 - (row ? 26 : 0);
        ctx.fillStyle = row ? '#221a3a' : '#2c2148';
        ctx.fillRect(bx, by - bh, bw, bh + 90);
        const warm = hsh % 3 === 0;
        ctx.fillStyle = warm ? 'rgba(255,210,120,0.5)' : 'rgba(140,220,255,0.36)';
        for (let wy = 0; wy < 5; wy++)
          for (let wx = 0; wx < 4; wx++)
            if (((hsh >> (wy*4+wx)) & 1) || hsh % 7 === 0)
              ctx.fillRect(bx + 8 + wx*14, by - bh + 10 + wy*20, 6, 9);
        if (hsh % 4 === 0){
          /* rooftop neon bar, flickering */
          ctx.globalAlpha = 0.45 + 0.55*Math.abs(Math.sin(globalT*2 + hsh));
          ctx.fillStyle = ['#ff4ad4','#3ad4e0','#ffe23e','#4aff6a'][hsh % 4];
          ctx.fillRect(bx + 6, by - bh - 9, bw - 12, 4);
          ctx.globalAlpha = 1;
        }
      }
    }
    /* near trees: dark rounded clumps */
    ctx.fillStyle = '#1e3a30';
    for (let i = -1; i < 10; i++){
      const tx = i*170 - (cx*0.38 % 170);
      const ty = 470 - cy*0.45;
      const hsh = ((i*48271+7)>>>0) % 13;
      ctx.beginPath();
      ctx.arc(tx, ty - 14 - (hsh % 6), 34 + (hsh % 5)*4, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(tx - 5, ty - 14, 10, 30);
    }
    /* wispy pale-yellow clouds */
    ctx.fillStyle = 'rgba(232,214,164,0.15)';
    for (const c of clouds){
      const span = VIEW_W + 300;
      const x = ((c.x - cx*0.5 + globalT*c.v) % span + span) % span - 150;
      const y = c.y * 0.6 - cy*0.15;
      const s = c.s;
      ctx.beginPath();
      ctx.ellipse(x, y, 54*s, 8*s, 0, 0, Math.PI*2);
      ctx.ellipse(x-32*s, y+6*s, 30*s, 5*s, 0, 0, Math.PI*2);
      ctx.fill();
    }
    return;
  }
  if (stage === 0){
    /* sun */
    ctx.fillStyle = 'rgba(255,240,170,0.9)';
    ctx.beginPath(); ctx.arc(150, 90 - cy*0.1, 42, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,170,0.25)';
    ctx.beginPath(); ctx.arc(150, 90 - cy*0.1, 60, 0, Math.PI*2); ctx.fill();
    /* far hills (parallax) */
    ctx.fillStyle = '#a8dcc0';
    for (let i = -1; i < 8; i++){
      const hx = i*340 - (cx*0.18 % 340);
      const hy = 400 - cy*0.25 + Math.sin(i*1.7)*26;
      ctx.beginPath(); ctx.arc(hx, hy, 190, Math.PI, 0); ctx.fill();
    }
    ctx.fillStyle = '#8fd0a8';
    for (let i = -1; i < 9; i++){
      const hx = i*260 - (cx*0.35 % 260);
      const hy = 452 - cy*0.4 + Math.cos(i*2.3)*20;
      ctx.beginPath(); ctx.arc(hx, hy, 150, Math.PI, 0); ctx.fill();
    }
    /* clouds */
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const c of clouds){
      const span = VIEW_W + 300;
      let x = ((c.x - cx*0.5 + globalT*c.v) % span + span) % span - 150;
      const y = c.y - cy*0.15;
      const s = c.s;
      ctx.beginPath();
      ctx.ellipse(x, y, 46*s, 15*s, 0, 0, Math.PI*2);
      ctx.ellipse(x-24*s, y+5*s, 26*s, 11*s, 0, 0, Math.PI*2);
      ctx.ellipse(x+26*s, y+6*s, 24*s, 10*s, 0, 0, Math.PI*2);
      ctx.fill();
    }
  } else if (stage === 1){
    /* marble: the zone's signature sight — a giant crystal core deep in the
       cavern, concentric rings slowly turning around a pulsing heart */
    const mx = VIEW_W*0.62 - cx*0.04, my = 148 - cy*0.08;
    const pulse = 0.5 + 0.5*Math.sin(globalT*0.9);
    /* outer halo */
    ctx.fillStyle = 'rgba(90,170,255,' + (0.05 + 0.03*pulse).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(mx, my, 150 + 8*pulse, 0, Math.PI*2); ctx.fill();
    /* slowly rotating segmented rings */
    ctx.strokeStyle = 'rgba(140,214,255,0.5)';
    ctx.lineWidth = 3;
    for (let r = 0; r < 3; r++){
      const rr = 64 + r*26;
      const rot = globalT*(0.12 + r*0.05) * (r % 2 ? -1 : 1);
      for (let seg = 0; seg < 6; seg++){
        const a0 = rot + seg*(Math.PI*2/6);
        ctx.beginPath(); ctx.arc(mx, my, rr, a0+0.12, a0+Math.PI*2/6-0.12); ctx.stroke();
      }
    }
    /* inner core */
    ctx.fillStyle = 'rgba(120,190,255,' + (0.10 + 0.05*pulse).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(mx, my, 40 + 5*pulse, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(214,240,255,' + (0.28 + 0.18*pulse).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(mx, my, 16 + 3*pulse, 0, Math.PI*2); ctx.fill();
    /* faint light beams through the core */
    ctx.strokeStyle = 'rgba(160,220,255,' + (0.08 + 0.08*pulse).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(mx-128, my); ctx.lineTo(mx+128, my);
    ctx.moveTo(mx, my-128); ctx.lineTo(mx, my+128);
    ctx.stroke();
    /* distant crystal spires (parallax) */
    for (let i = -1; i < 10; i++){
      const hx = i*240 - (cx*0.22 % 240);
      const hy = 470 - cy*0.3;
      const hsh = ((i*7919+3)>>>0) % 97;
      ctx.fillStyle = 'rgba(64,110,200,0.22)';
      ctx.beginPath();
      ctx.moveTo(hx-46, hy);
      ctx.lineTo(hx-14, hy-150-(hsh%50));
      ctx.lineTo(hx+8, hy-90);
      ctx.lineTo(hx+20, hy-170-((hsh>>2)%40));
      ctx.lineTo(hx+46, hy);
      ctx.closePath(); ctx.fill();
    }
    /* drifting glowing spores */
    for (const c of clouds){
      const span = VIEW_W + 300;
      let x = ((c.x*0.7 - cx*0.5 + globalT*c.v*0.6) % span + span) % span - 150;
      const y = (c.y*0.5 + 200) - cy*0.15;
      const tw = 0.4 + 0.6*Math.abs(Math.sin(globalT*1.3 + c.x));
      ctx.fillStyle = 'rgba(126,232,255,' + (0.25*tw).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, 2.2*c.s, 0, Math.PI*2); ctx.fill();
    }
  } else if (stage === 4){
    /* star light: a starry night over the construction site — twinkling
       stars, a distant city, metal gantries, big fan silhouettes and the
       faint outline of an egg-shaped loop */
    /* stars: two parallax layers, twinkling */
    for (let layer = 0; layer < 2; layer++){
      const par = layer ? 0.1 : 0.05;
      const n = layer ? 26 : 18;
      for (let i = 0; i < n; i++){
        const hsh = ((i*48271 + layer*97)>>>0) % 997;
        const sx = (i*(2654435761 % 9999) + layer*37) % 1400 - 200;
        const px = (sx - cx*par) % (VIEW_W + 200) + 100;
        const py = 20 + (hsh % 240) - cy*0.08;
        const tw = 0.4 + 0.6*Math.abs(Math.sin(globalT*(1.2 + layer) + hsh));
        ctx.fillStyle = 'rgba(220,235,255,' + ((layer ? 0.5 : 0.3) * tw).toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(((px % (VIEW_W+200)) + VIEW_W+200) % (VIEW_W+200) - 100, py, layer ? 1.6 : 2.2, 0, Math.PI*2); ctx.fill();
      }
    }
    /* distant city skyline: dark towers with sparse warm windows */
    for (let i = -1; i < 6; i++){
      const hsh = ((i*7919+5)>>>0) % 97;
      const bx = i*220 - ((cx*0.12) % 220);
      const bw = 54 + (hsh % 34);
      const bh = 80 + (hsh % 90);
      const by = 420 - cy*0.15;
      ctx.fillStyle = '#131a38';
      ctx.fillRect(bx, by - bh, bw, bh + 60);
      for (let wy = 0; wy < 4; wy++)
        for (let wx = 0; wx < 3; wx++)
          if (((hsh >> (wy*3+wx)) & 1) === 1 && hsh % 3 === 0){
            ctx.fillStyle = 'rgba(255,214,140,0.5)';
            ctx.fillRect(bx + 7 + wx*15, by - bh + 8 + wy*19, 6, 8);
          }
    }
    /* metal gantry truss crossing the upper sky (parallax) */
    ctx.strokeStyle = 'rgba(74,86,120,0.55)';
    ctx.lineWidth = 5;
    const gY = 128 - cy*0.25;
    for (let i = -1; i < 7; i++){
      const gx = i*260 - ((cx*0.32) % 260);
      ctx.beginPath();
      ctx.moveTo(gx, gY); ctx.lineTo(gx + 260, gY);
      ctx.moveTo(gx, gY); ctx.lineTo(gx + 260, gY);
      /* X bracing */
      ctx.moveTo(gx, gY); ctx.lineTo(gx + 65, gY - 26);
      ctx.moveTo(gx + 65, gY - 26); ctx.lineTo(gx + 130, gY);
      ctx.moveTo(gx + 130, gY); ctx.lineTo(gx + 195, gY - 26);
      ctx.moveTo(gx + 195, gY - 26); ctx.lineTo(gx + 260, gY);
      /* verticals */
      ctx.moveTo(gx, gY); ctx.lineTo(gx, gY + 18);
      ctx.moveTo(gx + 130, gY); ctx.lineTo(gx + 130, gY + 18);
      ctx.moveTo(gx + 260, gY); ctx.lineTo(gx + 260, gY + 18);
      ctx.stroke();
      /* hanging lamp from the truss */
      ctx.fillStyle = 'rgba(255,220,140,0.55)';
      ctx.beginPath(); ctx.arc(gx + 130, gY + 26, 3.4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,220,140,0.08)';
      ctx.beginPath(); ctx.arc(gx + 130, gY + 26, 15, 0, Math.PI*2); ctx.fill();
    }
    /* big dim fan silhouettes with slowly turning blades */
    for (let i = -1; i < 4; i++){
      const hsh = ((i*48271+11)>>>0) % 97;
      const fx = i*560 - ((cx*0.45) % 560) + 120;
      const fy = 200 + (hsh % 30) - cy*0.3;
      const fr = 52 + (hsh % 20);
      ctx.fillStyle = 'rgba(52,64,96,0.5)';
      ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(90,104,140,0.4)';
      ctx.beginPath(); ctx.arc(fx, fy, fr*0.7, 0, Math.PI*2); ctx.fill();
      const rot = globalT*0.7 + hsh;
      ctx.strokeStyle = 'rgba(140,156,190,0.4)';
      ctx.lineWidth = 4;
      for (let b = 0; b < 4; b++){
        const a = rot + b/4*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.lineTo(fx + Math.cos(a)*fr*0.62, fy + Math.sin(a)*fr*0.62);
        ctx.stroke();
      }
    }
    /* the faint outline of an egg-shaped loop in the far distance */
    const lx = 760 - cx*0.08, ly = 330 - cy*0.1;
    ctx.strokeStyle = 'rgba(96,116,168,0.28)';
    ctx.lineWidth = 10;
    ctx.beginPath(); ctx.arc(lx, ly, 110, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(140,160,210,0.2)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(lx, ly, 121, 0, Math.PI*2); ctx.stroke();
    /* drifting warm city-light specks */
    for (const c of clouds){
      const span = VIEW_W + 300;
      let x = ((c.x*0.8 - cx*0.5 + globalT*c.v*0.7) % span + span) % span - 150;
      const y = (c.y*0.7 + 90) - cy*0.12;
      const tw = 0.4 + 0.6*Math.abs(Math.sin(globalT*1.4 + c.x));
      ctx.fillStyle = 'rgba(255,214,140,' + (0.3*tw).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, 1.8*c.s, 0, Math.PI*2); ctx.fill();
    }
  } else if (stage === 5){
    /* SCRAP BRAIN: the polluted exterior of Eggman's industrial base —
       billowing smoke plumes, a distant complex of light-grey factories
       with blinking warning lights, and big rusted tanks and girders */
    /* far industrial complex: light-grey factories with blinking lights */
    for (let i = -1; i < 7; i++){
      const hsh = ((i*7919+5)>>>0) % 97;
      const bx = i*200 - ((cx*0.1) % 200);
      const bw = 70 + (hsh % 40);
      const bh = 70 + (hsh % 80);
      const by = 400 - cy*0.12;
      ctx.fillStyle = '#4a525e';
      ctx.fillRect(bx, by - bh, bw, bh + 60);
      /* roof ridge */
      ctx.fillStyle = '#5a6470';
      ctx.fillRect(bx - 4, by - bh - 6, bw + 8, 8);
      /* blinking warning lights along the roofline */
      for (let w = 0; w < 3; w++){
        const wx = bx + 10 + w*(bw-20)/2;
        const on = Math.sin(globalT*2.2 + hsh + w) > 0.2;
        ctx.fillStyle = on ? ['#ff5a4e','#ffe23e','#4aff6a'][(hsh+w) % 3] : 'rgba(90,96,110,0.6)';
        ctx.beginPath(); ctx.arc(wx, by - bh - 9, 2.6, 0, Math.PI*2); ctx.fill();
        if (on){ ctx.fillStyle = 'rgba(255,120,90,0.22)'; ctx.beginPath(); ctx.arc(wx, by - bh - 9, 7, 0, Math.PI*2); ctx.fill(); }
      }
      /* dim window grid */
      for (let wy = 0; wy < 4; wy++)
        for (let wx = 0; wx < 4; wx++)

    for (let x = pl.x; x < pl.x+pl.w; x += 10){
      ctx.fillStyle = ((x/10) | 0) % 2 === 0 ? '#e0a030' : '#2a2e3a';
      ctx.fillRect(Math.max(x, pl.x), pl.y, Math.min(10, pl.x+pl.w-x), 4);

    ctx.beginPath(); ctx.arc(pl.x+5, pl.y+9, 1.8, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = 'rgba(205,244,255,0.9)';

function drawSpring(s){
  const ext = s.t > 0 ? (s.mega ? 10 : 6) : 0;
  const cave = stage === 1, mega = !!s.mega, yard = stage === 2;
  const w = mega ? 24 : 16;
  if (mega){
    /* red mega-springs glow and shimmer */
    ctx.fillStyle = 'rgba(255,90,78,0.22)';
    ctx.beginPath(); ctx.arc(s.x, s.y-14, 30, 0, Math.PI*2); ctx.fill();
  }

  ctx.fillStyle = cave ? '#4a5a78' : mega ? '#8a2a2a' : yard ? '#9a9a50' : lab ? '#6a9a50' : '#8895a8';
  ctx.fillRect(s.x-w, s.y-2, w*2, 6);

  ctx.fillStyle = cave ? '#2a6cd4' : mega ? '#a02020' : lab ? '#4a9a4a' : '#c7a500';
  ctx.fillRect(s.x-w, top+1, w*2, 2);
  if (mega){
    /* sparkle on the mega pad */
    const tw = 0.5 + 0.5*Math.sin(globalT*6);
    ctx.fillStyle = 'rgba(255,200,180,' + (0.5+0.5*tw).toFixed(2) + ')';
    ctx.font = 'bold 10px Consolas, monospace';

}
function drawBumpers(){
  for (const b of BUMPERS){
    const col = BUMPCOL[b.ph % 4];

    ctx.fillStyle = '#6a7080';
    ctx.beginPath();
    ctx.moveTo(b.x-b.r-4, b.y+6);
    ctx.lineTo(b.x-b.r+2, b.y-4);

    ctx.lineTo(b.x+b.r+4, b.y+6);
    ctx.closePath(); ctx.fill();
    /* dome */
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(b.x, b.y-4, b.r-4, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';

function drawPitMarker(pit){

function drawFan(f){
  const on = Math.sin(globalT*f.sp + f.ph) > 0.7;
  const cx = f.x, cy = f.y - 34;
  /* base */
  ctx.fillStyle = '#4a5268';
  ctx.fillRect(cx-10, f.y-8, 20, 8);
  /* housing */
  ctx.fillStyle = '#5a6478';
  ctx.beginPath(); ctx.arc(cx, cy, f.r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2a3040';
  ctx.beginPath(); ctx.arc(cx, cy, f.r-6, 0, Math.PI*2); ctx.fill();
  /* blades — they spin fast during a blast */
  const rot = on ? globalT*22 : globalT*2.5;
  ctx.fillStyle = on ? '#9ab0d0' : '#5a6880';
  for (let i = 0; i < 4; i++){
    const a = rot + i/4*Math.PI*2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.ellipse(f.r*0.5, 0, f.r*0.45, 7, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#8a94a8';
  ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();
  if (on){
    /* active: a bright ring and wind streaks blowing left */
    ctx.strokeStyle = 'rgba(190,220,255,0.5)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy, f.r+4, 0, Math.PI*2); ctx.stroke();
    for (let i = 0; i < 3; i++){
      const wy = cy - 16 + i*16;
      const off = (globalT*140 + i*20) % 40;
      ctx.strokeStyle = 'rgba(200,230,255,' + (0.5 - i*0.1).toFixed(2) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - f.r - 8 - off, wy);
      ctx.lineTo(cx - f.r - 34 - off, wy);
      ctx.stroke();
    }
  } else {
    /* idle: a little blinking red safety light */
    const bl = Math.sin(globalT*3 + f.ph*5) > 0;
    ctx.fillStyle = bl ? '#ff5a4e' : '#6a2a20';
    ctx.beginPath(); ctx.arc(cx, cy - f.r - 5, 3, 0, Math.PI*2); ctx.fill();
  }
}
function drawSeesaw(s){

/* scrap brain flame jet (zone 6): a ground nozzle that spits a straight
   jet of fire in short timed windows — lethal while it's lit */
function drawJet(j){
  const on = Math.sin(globalT*j.sp + j.ph) > 0.7;
  /* nozzle base: a trapezoid of rusted metal */
  ctx.fillStyle = '#4a525e';
  ctx.beginPath();
  ctx.moveTo(j.x-13, j.y);
  ctx.lineTo(j.x-8, j.y-10);
  ctx.lineTo(j.x+8, j.y-10);
  ctx.lineTo(j.x+13, j.y);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#333a44';
  ctx.fillRect(j.x-5, j.y-12, 10, 4);
  /* state light: red when lit, dim when idle */
  ctx.fillStyle = on ? '#ff8a3e' : (Math.sin(globalT*2 + j.x) > 0.9 ? '#ff5a4e' : '#4a3a30');
  ctx.beginPath(); ctx.arc(j.x, j.y-13, 2.6, 0, Math.PI*2); ctx.fill();
  if (on){
    /* the jet itself: three stacked flames with a flickering height */
    const flick = 0.75 + 0.25*Math.sin(globalT*28 + j.ph*7);
    const h = 78 * flick;
    ctx.fillStyle = 'rgba(255,120,50,0.35)';
    ctx.beginPath(); ctx.arc(j.x, j.y-10-h*0.5, 17, 0, Math.PI*2); ctx.fill();
    const layers = [
      ['#ff5a2e', 13, 1.0],
      ['#ffa03e', 9, 0.82],
      ['#ffe23e', 5, 0.6],
    ];
    for (const [col, w, hf] of layers){
      ctx.fillStyle = col;
      const hh = h * hf;
      ctx.beginPath();
      ctx.moveTo(j.x - w, j.y-10);
      ctx.quadraticCurveTo(j.x - w*0.9, j.y-10-hh*0.45, j.x + Math.sin(globalT*20 + j.ph)*2.5, j.y-10-hh);
      ctx.quadraticCurveTo(j.x + w*0.9, j.y-10-hh*0.45, j.x + w, j.y-10);
      ctx.closePath(); ctx.fill();
    }
    /* falling embers */
    for (let i = 0; i < 3; i++){
      const ph = (globalT*3 + i*0.37 + j.ph) % 1;
      ctx.fillStyle = 'rgba(255,' + (140 + (i*40)) + ',60,' + (1-ph).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(j.x + Math.sin(ph*9 + i*4)*9, j.y-12-ph*66, 2.2*(1-ph*0.5), 0, Math.PI*2);
      ctx.fill();
    }
  }
}

  ctx.beginPath(); ctx.moveTo(x + 9, y - 52); ctx.lineTo(x + 1, y - 48); ctx.stroke();
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(x + 4, y - 34, 10, 3);
  /* low-HP sparks */
  if (b.hp <= 2 && Math.sin(globalT * 12) > 0.4){
    ctx.fillStyle = '#ffd23e';
    for (let i = 0; i < 3; i++){
      const a = globalT * 6 + i * 2.1;
      ctx.fillRect(x + Math.cos(a) * 20 - 2, y - 30 + Math.sin(a) * 14, 4, 4);

function drawOrbs(){
  for (const o of ORBS){
    const x = o.cx + Math.sin(globalT*o.sp + o.ph) * o.ax;
    const y = o.cy + Math.sin(globalT*o.sp*0.8 + o.ph) * o.ay;
    /* soft shadow under the ball */
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x, y + o.r + 4, o.r*0.8, 3, 0, 0, Math.PI*2); ctx.fill();
    /* iron ball with red band */
    ctx.fillStyle = '#b8c0d0';
    ctx.beginPath(); ctx.arc(x, y, o.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e04a4a';
    ctx.beginPath(); ctx.arc(x, y, o.r, -0.5, 0.5); ctx.lineTo(x, y); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6a7080'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, o.r, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(x-4, y-4, 3, 0, Math.PI*2); ctx.fill();
  }
}
/* ---------- labyrinth traps (zone 4) ---------- */
function drawWalls(){
  for (const w of WALLS){
    const bot = (w.y0+w.y1)/2 + ((w.y1-w.y0)/2) * Math.sin(globalT*w.sp + w.ph);
    const top = bot - w.h;
    /* guide rail */
    ctx.fillStyle = 'rgba(28,22,10,0.55)';
    ctx.fillRect(w.x-7, w.y0-12, w.w+14, w.y1-w.y0+26);
    /* slab */
    ctx.fillStyle = '#a07840';
    ctx.fillRect(w.x, top, w.w, w.h);
    /* brick courses */
    ctx.fillStyle = 'rgba(60,44,20,0.6)';
    for (let y = top+14; y < bot-4; y += 14) ctx.fillRect(w.x, y, w.w, 3);
    /* caps */
    ctx.fillStyle = '#5a4428';
    ctx.fillRect(w.x-3, top-6, w.w+6, 8);
    ctx.fillRect(w.x-3, bot-2, w.w+6, 8);
    /* moss on the left edge */
    ctx.fillStyle = 'rgba(70,140,80,0.5)';
    ctx.fillRect(w.x, top+6, 4, w.h-20);
    /* warning glow while the gap is closing */
    const gap = w.floor - bot;
    if (gap < 60){
      const k = 1 - Math.max(0, gap)/60;
      ctx.fillStyle = 'rgba(255,120,60,' + (0.28*k).toFixed(2) + ')';
      ctx.fillRect(w.x-4, bot-2, w.w+8, 7);
    }
  }
}
function drawSpikes(){
  for (const s of SPIKES){
    const act = Math.sin(globalT*s.sp + s.ph) > 0.866;
    const n = 7, wdt = (s.x1 - s.x0) / n;
    /* base plate */
    ctx.fillStyle = '#4a5058';
    ctx.fillRect(s.x0 - 4, s.y - 4, s.x1 - s.x0 + 8, 8);
    for (let i = 0; i < n; i++){
      const cx0 = s.x0 + i*wdt;
      const h = act ? 18 : 4;
      ctx.fillStyle = act ? '#8a94a4' : '#3a4250';
      ctx.beginPath();
      ctx.moveTo(cx0 + 1, s.y - 2);
      ctx.lineTo(cx0 + wdt/2, s.y - 2 - h);
      ctx.lineTo(cx0 + wdt - 1, s.y - 2);
      ctx.closePath(); ctx.fill();
      if (act){
        ctx.fillStyle = '#ff6a4e';
        ctx.beginPath();
        ctx.moveTo(cx0 + wdt*0.3, s.y - 2 - h*0.55);
        ctx.lineTo(cx0 + wdt/2, s.y - 2 - h);
        ctx.lineTo(cx0 + wdt*0.7, s.y - 2 - h*0.55);
        ctx.closePath(); ctx.fill();
      }
    }
    /* shimmer just before they extend */
    const ph = Math.sin(globalT*s.sp + s.ph);
    if (!act && ph > 0.6 && ph < 0.866){
      ctx.fillStyle = 'rgba(255,106,78,' + (0.3 + 0.3*Math.sin(globalT*20)).toFixed(2) + ')';
      ctx.fillRect(s.x0 - 4, s.y - 8, s.x1 - s.x0 + 8, 3);
    }
  }
}
function drawPends(){
  for (const q of PENDS){
    const ang = q.amp * Math.sin(globalT*q.sp + q.ph);
    const bx = q.ax + Math.sin(ang) * q.len;
    const by = q.ay + Math.cos(ang) * q.len;
    /* anchor mount */
    ctx.fillStyle = '#5a6068';
    ctx.fillRect(q.ax-10, q.ay-12, 20, 10);
    /* chain */
    ctx.strokeStyle = '#6a7078';
    ctx.lineWidth = 3;
    ctx.beginPath();
    const segs = 5;
    for (let i = 0; i < segs; i++){
      const t0 = i/segs, t1 = (i+1)/segs;
      ctx.moveTo(q.ax + Math.sin(ang)*q.len*t0, q.ay + Math.cos(ang)*q.len*t0);
      ctx.lineTo(q.ax + Math.sin(ang)*q.len*t1, q.ay + Math.cos(ang)*q.len*t1);
    }
    ctx.stroke();
    /* iron ball (the Spring Yard style: grey with a red band) */
    ctx.fillStyle = '#b8c0d0';
    ctx.beginPath(); ctx.arc(bx, by, q.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e04a4a';
    ctx.beginPath(); ctx.arc(bx, by, q.r, -0.5, 0.5); ctx.lineTo(bx, by); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6a7080'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, q.r, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(bx-4, by-4, 3, 0, Math.PI*2); ctx.fill();
  }
}
function drawFireball(f){
  ctx.fillStyle = 'rgba(255,120,40,0.35)';
  ctx.beginPath(); ctx.arc(f.x, f.y, 12, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff8a2e';
  ctx.beginPath(); ctx.arc(f.x, f.y, 7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffe23e';
  ctx.beginPath(); ctx.arc(f.x - 1.5, f.y - 1.5, 3.4, 0, Math.PI*2); ctx.fill();
  /* trail */
  ctx.strokeStyle = 'rgba(255,140,60,0.5)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(f.x - Math.sign(f.vx)*10, f.y);
  ctx.lineTo(f.x - Math.sign(f.vx)*22, f.y + Math.sin(globalT*20)*3);
  ctx.stroke();
}
function drawCheckpoint(c){
  ctx.fillStyle = '#8895a8';
  ctx.fillRect(c.x-2, c.y-72, 4, 72);
  ctx.fillStyle = '#5b6778';
  ctx.fillRect(c.x-8, c.y-4, 16, 5);

}
function drawGoal(){
  if (stage === 6) return; /* the final zone's goal is the boss, not a gate */
  const gy = stage === 0 ? 480 : stage === 1 ? 470 : stage === 2 ? 460 : 480;
  const accent = stage === 0 ? '#4fd159' : stage === 1 ? '#4aa3ff' : stage === 2 ? '#ff8a3e' : '#3ad4a0';
  ctx.fillStyle = stage === 0 ? '#e8eef5' : stage === 1 ? '#c9d8f0' : stage === 2 ? '#e8e0f0' : '#d8e8e0';
  ctx.fillRect(GOAL_X-46, gy-180, 14, 180);
  ctx.fillRect(GOAL_X+32, gy-180, 14, 180);
  /* checker caps */
  for (let i=0;i<4;i++){
    ctx.fillStyle = i%2 ? '#22303f' : (stage === 0 ? '#f5f7fa' : '#a8c8f0');
    ctx.fillRect(GOAL_X-46+i*3.5, gy-190, 14, 10);
    ctx.fillRect(GOAL_X+32+i*3.5, gy-190, 14, 10);
  }
  /* banner */
  ctx.fillStyle = stage === 0 ? '#173042' : '#101b3a';
  roundRect(GOAL_X-62, gy-212, 124, 34, 8); ctx.fill();
  ctx.fillStyle = accent;
  ctx.font = 'bold 19px Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(stage < STAGES.length-1 ? 'ZONE CLEAR' : 'CASH OUT', GOAL_X, gy-188);
  /* blinking light */
  if (Math.sin(globalT*5) > 0){
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.arc(GOAL_X, gy-220, 5, 0, Math.PI*2); ctx.fill();
  }
}
function drawRing(x, y, phase){
  const s = Math.cos(globalT*5 + phase);
  const w = 8.5 * (0.25 + 0.75*Math.abs(s));
  const dir = s >= 0 ? 1 : -1;
  ctx.save();
  ctx.translate(x, y + Math.sin(globalT*2.2 + phase)*2);
  ctx.shadowColor = 'rgba(84,224,122,0.8)';
  ctx.shadowBlur = 8;
  ctx.strokeStyle = '#37d95f';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.ellipse(0, 0, w, 8.5, 0, 0, Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(220,255,230,0.9)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.ellipse(0, -1.5, w*0.55, 4.5, 0, Math.PI, Math.PI*2 + (dir>0?0.4:0)); ctx.stroke();
  ctx.restore();
}
function tag(x, y, txt, col){
  ctx.font = 'bold 9px Consolas, monospace';
  const w = ctx.measureText(txt).width + 10;
  ctx.fillStyle = 'rgba(16,24,34,0.75)';
  roundRect(x-w/2, y-9, w, 13, 4); ctx.fill();
  ctx.fillStyle = col;
  ctx.textAlign = 'center';
  ctx.fillText(txt, x, y+1);
}
function drawEnemy(e){
  const r = enemyRadius(e);
  const x = e.x, y = e.y;
  ctx.save();
  ctx.translate(x, y - r);
  if (e.type === 'fee'){
    /* grumpy spiky fee blob */
    ctx.fillStyle = '#8a4d2f';
    for (let i=0;i<7;i++){
      const a = Math.PI + i/(6)*Math.PI;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*0.6, Math.sin(a)*r*0.6 - 2);
      ctx.lineTo(Math.cos(a)*(r+6), Math.sin(a)*(r+6) - 2);
      ctx.lineTo(Math.cos(a+0.4)*r*0.6, Math.sin(a+0.4)*r*0.6 - 2);

    }

    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd23e';
    ctx.font = 'bold 13px Consolas, monospace';
    ctx.textAlign = 'center';

    ctx.fillStyle = '#222';

      ctx.beginPath(); ctx.arc(-5, -3, 2, 0, Math.PI*2); ctx.arc(5, -3, 2, 0, Math.PI*2); ctx.fill();

    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('S', 0, 3.5);

    ctx.beginPath(); ctx.ellipse(0, 4, r, r*0.75, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#a06a26';
    ctx.beginPath();

      ctx.lineTo(bx+r*0.18, -r*0.55);

    }
    ctx.fill();
    ctx.fillStyle = '#e8c07a';
    ctx.beginPath(); ctx.arc(r*0.95, 2, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(r*0.95+1, 0, 1.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#a06a26';
    const lp = Math.sin(globalT*6)*2.5;

    ctx.fillRect(r*0.35, 8-lp, 5, 5);

    ctx.strokeStyle = 'rgba(150,90,220,0.9)'; ctx.lineWidth = 3;
